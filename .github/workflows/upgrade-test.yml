name: Upgrade test

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenario ids or groups (core, channels, faults, transfer, scope); empty runs every automated scenario"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "bun.lock"
      - "apps/desktop/package.json"
      - "apps/desktop/src/main/updates/**"
      - "apps/server/src/shutdown/**"
      - "apps/desktop/src/main/index.ts"
      - "apps/desktop/electron-builder*.yml"
      - "apps/desktop/electron.vite.config.ts"
      - "packages/contracts/src/updates.ts"
      - "packages/contracts/src/shutdown.ts"
      - "scripts/verify-installed-upgrade.mjs"
      - "scripts/lib/**"
      - "scripts/fixtures/**"
      - "tools/release/src/feed*.ts"
      - "tools/release/src/rehash.ts"
      - "tools/release/src/updateInfoYaml.ts"
      - "tools/release/src/semver.ts"
      - "tools/release/src/upgradeScenarios.ts"
      - ".github/workflows/upgrade-test.yml"

permissions:
  contents: read

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  nightly-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      already-tested: ${{ steps.last-pass.outputs.already-tested }}
    steps:
      - id: last-pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/upgrade-test.yml/runs?branch=$GITHUB_REF_NAME&event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0] | "\(.head_sha // "") \(.conclusion // "")"')
          if [ "$latest" = "$GITHUB_SHA success" ]; then echo "already-tested=true" >> "$GITHUB_OUTPUT"; fi

  installed-upgrade:
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.already-tested != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SCENARIOS: ${{ inputs.scenarios || (github.event_name == 'pull_request' && 'core' || '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Feed server, manifest and scenario contract tests
        run: bun --filter @cw-code/release-tools test
      - name: Production main bundle carries no autotest path
        run: |
          bun --filter @cw-code/desktop build
          bun scripts/verify-installed-upgrade.mjs --assert-production-bundle
      - name: Build update-test installers and validate every scenario feed (no install)
        run: |
          args=(--dry-run --work-dir "$RUNNER_TEMP/upgrade-dry-run" --evidence "$RUNNER_TEMP/upgrade-evidence/dry-run.json")
          if [ -n "$SCENARIOS" ]; then args+=(--scenarios "$SCENARIOS"); fi
          bun scripts/verify-installed-upgrade.mjs "${args[@]}"
      - name: Installed upgrade scenarios (disposable runner only)
        run: |
          args=(--skip-build --disposable-environment --work-dir "$RUNNER_TEMP/upgrade-run" --evidence "$RUNNER_TEMP/upgrade-evidence/installed.json")
          if [ -n "$SCENARIOS" ]; then args+=(--scenarios "$SCENARIOS"); fi
          bun scripts/verify-installed-upgrade.mjs "${args[@]}"
      - name: Upload redacted evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-evidence
          retention-days: 7
          if-no-files-found: warn
