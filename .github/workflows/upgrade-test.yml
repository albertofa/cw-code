name: Upgrade test

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma-separated scenario ids or groups (core, channels, faults, transfer, scope); empty runs every automated scenario"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "apps/desktop/src/main/updates/**"
      - "apps/desktop/src/main/shutdown/**"
      - "apps/desktop/src/main/index.ts"
      - "apps/desktop/electron-builder*.yml"
      - "apps/desktop/electron.vite.config.ts"
      - "scripts/verify-installed-upgrade.mjs"
      - "scripts/lib/**"
      - "scripts/fixtures/**"
      - "tools/release/src/feed*.ts"
      - "tools/release/src/upgradeScenarios.ts"
      - ".github/workflows/upgrade-test.yml"

permissions:
  contents: read

concurrency:
  group: upgrade-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  installed-upgrade:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SCENARIOS: ${{ inputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Feed server, manifest and scenario contract tests
        run: pnpm --filter @cw-code/release-tools test
      - name: Production main bundle carries no autotest path
        run: |
          pnpm --filter @cw-code/desktop build
          node scripts/verify-installed-upgrade.mjs --assert-production-bundle
      - name: Build update-test installers and validate every scenario feed (no install)
        run: |
          args=(--dry-run --work-dir "$RUNNER_TEMP/upgrade-dry-run" --evidence "$RUNNER_TEMP/upgrade-evidence/dry-run.json")
          if [ -n "$SCENARIOS" ]; then args+=(--scenarios "$SCENARIOS"); fi
          node scripts/verify-installed-upgrade.mjs "${args[@]}"
      - name: Installed upgrade scenarios (disposable runner only)
        run: |
          args=(--skip-build --work-dir "$RUNNER_TEMP/upgrade-run" --evidence "$RUNNER_TEMP/upgrade-evidence/installed.json")
          if [ -n "$SCENARIOS" ]; then args+=(--scenarios "$SCENARIOS"); fi
          node scripts/verify-installed-upgrade.mjs "${args[@]}"
      - name: Upload redacted evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-evidence
          retention-days: 7
          if-no-files-found: warn
