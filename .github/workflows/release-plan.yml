name: Release Plan

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to plan"
        required: true
        type: choice
        options:
          - alpha
          - stable
      candidate:
        description: "Candidate tag or full 40-hex commit SHA (required for channel=stable)"
        required: false
        type: string
      expected_sha:
        description: "Expected full 40-hex commit SHA for the candidate tag (stable only; pins the tested SHA)"
        required: false
        type: string
      force:
        description: "channel=alpha only: bypass the 6-hour coalescing window (never the unchanged-HEAD or ordering checks)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-plan-${{ github.event.inputs.channel || 'alpha' }}

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Plan release
        id: plan
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'alpha' }}
          CANDIDATE: ${{ github.event.inputs.candidate }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=(plan --channel "$CHANNEL" --out plan.json)
          if [ -n "$CANDIDATE" ]; then
            ARGS+=(--candidate "$CANDIDATE")
          fi
          if [ -n "$EXPECTED_SHA" ]; then
            ARGS+=(--expected-sha "$EXPECTED_SHA")
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          node tools/release/src/cli/release.ts "${ARGS[@]}"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.event.inputs.channel || 'alpha' }}
          path: plan.json
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'alpha' }}
          OUT_CHANNEL: ${{ steps.plan.outputs.channel }}
          OUT_SKIP: ${{ steps.plan.outputs.skip }}
          OUT_REASON: ${{ steps.plan.outputs.reason }}
          OUT_VERSION: ${{ steps.plan.outputs.version }}
          OUT_TAG: ${{ steps.plan.outputs.tag }}
          OUT_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          {
            echo "### Release plan (channel: ${OUT_CHANNEL:-$CHANNEL})"
            if [ "$OUT_SKIP" = "true" ]; then
              echo "Skipped: $OUT_REASON"
            else
              echo "- version: $OUT_VERSION"
              echo "- tag: $OUT_TAG"
              echo "- sha: $OUT_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
