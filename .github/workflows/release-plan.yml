name: Release Plan

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to plan"
        required: true
        type: choice
        options:
          - alpha
          - stable
      candidate:
        description: "Candidate tag or commit SHA (required for channel=stable)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-plan-${{ github.event.inputs.channel || 'alpha' }}

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Plan release
        id: plan
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'alpha' }}"
          ARGS=(plan --channel "$CHANNEL" --out plan.json)
          if [ -n "${{ github.event.inputs.candidate }}" ]; then
            ARGS+=(--candidate "${{ github.event.inputs.candidate }}")
          fi
          node tools/release/src/cli/release.ts "${ARGS[@]}"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.event.inputs.channel || 'alpha' }}
          path: plan.json
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Release plan (channel: ${{ steps.plan.outputs.channel || github.event.inputs.channel || 'alpha' }})"
            if [ "${{ steps.plan.outputs.skip }}" = "true" ]; then
              echo "Skipped: ${{ steps.plan.outputs.reason }}"
            else
              echo "- version: ${{ steps.plan.outputs.version }}"
              echo "- tag: ${{ steps.plan.outputs.tag }}"
              echo "- sha: ${{ steps.plan.outputs.sha }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
