name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Production main bundle carries no update autotest path
        run: bun scripts/verify-installed-upgrade.mjs --assert-production-bundle

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Use a long-path temp directory
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package installer with the canonical dist script
        run: bun --filter @cw-code/desktop dist
      - name: Reject any update autotest path in the packaged app
        run: bun scripts/verify-installed-upgrade.mjs --assert-production-bundle --asar apps/desktop/dist/win-unpacked/resources/app.asar
      - name: Clean install + packaged startup probe (canonical build)
        run: bun scripts/verify-windows-package.mjs --install --disposable-environment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-package
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/verify-windows-package.json
          retention-days: 7

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the packaged-app probe dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package the AppImage and deb with the canonical dist script
        run: bun --filter @cw-code/desktop dist:linux
      - name: Reject any update autotest path in the packaged app
        run: bun scripts/verify-installed-upgrade.mjs --assert-production-bundle --asar apps/desktop/dist/linux-unpacked/resources/app.asar
      - name: AppImage start + deb install, start, node-pty, remove (canonical build)
        run: bun scripts/verify-linux-package.mjs --desktop-dir apps/desktop --dist apps/desktop/dist --install-deb --disposable-environment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-package-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/verify-linux-package.json
          retention-days: 7
