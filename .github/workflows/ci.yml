name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package installer with a CI-only version strictly higher than the legacy release
        run: pnpm --filter @cw-code/desktop exec electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=0.0.2-ci.${{ github.run_number }}
      - name: Download legacy installer for upgrade tests
        run: gh release download v0.0.1-alpha.21 --repo albertofa/cw-code --pattern "cw-code.Setup.0.0.1-alpha.21.exe" --dir legacy-installer
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/verify-windows-package.mjs --install
      - name: Upgrade test (default per-user path)
        run: node scripts/verify-windows-package.mjs --upgrade-from legacy-installer/cw-code.Setup.0.0.1-alpha.21.exe
      - name: Upgrade test (custom install directory)
        run: node scripts/verify-windows-package.mjs --upgrade-from legacy-installer/cw-code.Setup.0.0.1-alpha.21.exe --custom-dir "${{ runner.temp }}\cw-code-custom"
      - name: Upgrade test (per-machine /allusers)
        run: node scripts/verify-windows-package.mjs --upgrade-from legacy-installer/cw-code.Setup.0.0.1-alpha.21.exe --per-machine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/verify-windows-package.json
          retention-days: 7
