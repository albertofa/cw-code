name: Check update feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      verify_installer_digest:
        description: "Also download each channel's installer in full (about 100 MB each) and compare its sha512"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-update-feed
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the stable and alpha feeds the way installed clients read them
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_INSTALLER_DIGEST: ${{ inputs.verify_installer_digest }}
        run: |
          args=(monitor-feed --attempts 3 --delay-seconds 30)
          if [ "$VERIFY_INSTALLER_DIGEST" = "true" ]; then args+=(--verify-installer-digest); fi
          node tools/release/src/cli/release.ts "${args[@]}"
