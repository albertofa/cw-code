name: Check update feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      verify_installer_digest:
        description: "Also download each channel's installer in full (about 100 MB each) and compare its sha512"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-update-feed
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the release tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the stable and alpha feeds the way installed clients read them
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_INSTALLER_DIGEST: ${{ inputs.verify_installer_digest }}
        run: |
          args=(monitor-feed --attempts 3 --delay-seconds 30)
          if [ "$VERIFY_INSTALLER_DIGEST" = "true" ]; then args+=(--verify-installer-digest); fi
          bun tools/release/src/cli/release.ts "${args[@]}"
