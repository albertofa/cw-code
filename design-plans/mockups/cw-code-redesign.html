<script>
const ic = (n, c = "") => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const drv = (d, s = "s14") => ic(d, `${s} d-${d}`);
const av = (label, hue, lg) => `<span class="av${lg ? " lg" : ""}" style="background:hsl(${hue} 32% 36%)">${label}</span>`;
const winctl = `<div class="winctl"><span>${ic("min", "s14")}</span><span>${ic("sq", "s12")}</span><span>${ic("x", "s14")}</span></div>`;

const ST = {
  run: (t = "Running") => `<span class="st run">${ic("loader", "s12 spin")}${t}</span>`,
  appr: () => `<span class="st appr">${ic("shield", "s12")}Approval</span>`,
  input: () => `<span class="st input">${ic("help", "s12")}Input</span>`,
  fail: () => `<span class="st fail">${ic("alert", "s12")}Failed</span>`,
  done: () => `<span class="st done"><span class="dot unseen"></span>Done</span>`,
  age: (a) => `<span class="st age">${a}</span>`,
};

const PR = {
  ok: (n) => `<span class="prc ok" title="PR #${n} · checks passing">${ic("pr", "s12")}#${n}</span>`,
  bad: (n) => `<span class="prc bad" title="PR #${n} · checks failing">${ic("pr", "s12")}#${n}</span>`,
  merged: (n) => `<span class="prc merged" title="PR #${n} · merged">${ic("merge", "s12")}#${n}</span>`,
  review: (n) => `<span class="prc rev" title="Reviewing PR #${n}">${ic("eye", "s12")}#${n}</span>`,
};

const WS = [
  { id: "s2", title: "Retry slot sync after 429", project: "scheduler-api", ab: "SA", hue: 190, branch: "cw/slot-retry", driver: "codex", st: ST.appr(), attn: { kind: "appr", verb: "Approve", icon: "shield", line: '<span class="mono">dotnet test</span> · waiting 1:05' } },
  { id: "s3", title: "Bump EF Core to 10", project: "cmutil", ab: "CM", hue: 30, branch: "deps/ef10", driver: "opencode", st: ST.input(), attn: { kind: "input", verb: "Answer", icon: "help", line: "Which base branch should the worktree use?" } },
  { id: "s1", title: "Redesign sidebar status", project: "cw-code", ab: "CW", hue: 262, branch: "cw/1d8f716e", driver: "claude", st: ST.run(), pr: PR.ok(38) },
  { id: "s5", title: "Review permission event stream", project: "cw-code", ab: "CW", hue: 262, branch: "mf/perm-stream", driver: "claude", st: ST.run(), pr: PR.review(41) },
  { id: "s6", title: "Keep working-set sessions warm", project: "cw-code", ab: "CW", hue: 262, branch: "cw/warm-ws", driver: "claude", st: ST.done(), pr: PR.merged(36) },
  { id: "s4", title: "Paginate availability query", project: "scheduler-api", ab: "SA", hue: 190, branch: "cw/paginate", driver: "codex", st: `<span class="st age">Holding · 1h</span>`, pr: PR.bad(118), attn: { kind: "update", verb: "Review", icon: "bell", line: "#118 · 2 checks failing · 1 new review" } },
];
const IDLE = [
  ["Health check endpoint", "scheduler-api", "", "5h", "claude"],
  ["Usage panel ledger", "cw-code", PR.ok(31), "3d", "codex"],
  ["Terminal font fallback", "cw-code", "", "1w", "opencode"],
  ["Remove legacy design docs", "cw-code", "", "2w", "claude"],
];
const RESOLVED = [
  ["Worktree cleanup on quit", "cw-code", PR.merged(29), "3d", "claude"],
  ["Slot cache invalidation", "scheduler-api", PR.merged(97), "2w", "codex"],
];

function wsRow(s, active) {
  if (s.attn) {
    return `
    <div class="ws attn ${s.attn.kind}${active === s.id ? " on-row" : ""}">
      <div class="body">
        <div class="t">${s.title}</div>
        <div class="att-line">${s.attn.line}</div>
      </div>
      <div class="r"><span class="att-chip">${ic(s.attn.icon, "s12")}${s.attn.verb}</span><span class="rr">${av(s.ab, s.hue)}${drv(s.driver, "s14")}</span></div>
    </div>`;
  }
  return `
    <div class="ws${active === s.id ? " on-row" : ""}">
      <div class="body">
        <div class="t">${s.title}</div>
        <div class="m">${av(s.ab, s.hue)}<span>${s.project}</span><span class="sepdot">·</span>${ic("branch", "s12")}<span class="mono">${s.branch}</span></div>
      </div>
      <div class="r">${s.st}<span class="rr">${s.pr || ""}${drv(s.driver, "s14")}</span></div>
    </div>`;
}

function flatRow(t, project, pr, age, d, kind) {
  return `<div class="srow flat ${kind}"><span class="t">${t}<span class="proj-n">${project}</span></span>${pr}${kind === "resolved" ? `<span class="st res">${ic("check", "s12")}${age}</span>` : ST.age(age)}${drv(d, "s14")}</div>`;
}

function sidebar(active, opts = {}) {
  const list = opts.search
    ? `<div class="sec needs">Needs you <span class="needs-n">1</span></div>
       ${wsRow(WS[0], active)}
       <div class="sec">Idle and resolved <span class="n">3</span><span class="end"><span class="qf">Newest${ic("chev-d", "s12")}</span></span></div>
       ${flatRow("<mark>Slot</mark> API contract tests", "scheduler-api", "", "1mo", "claude", "idle")}
       ${flatRow("<mark>Slot</mark> cache invalidation", "scheduler-api", PR.merged(97), "2w", "codex", "resolved")}
       ${flatRow("Fix <mark>slot</mark> timezone offsets", "scheduler-api", PR.merged(64), "2mo", "opencode", "resolved")}`
    : `<div class="sec needs">Needs you <span class="needs-n">${WS.filter((w) => w.attn).length}</span></div>
       ${WS.filter((w) => w.attn).map((s) => wsRow(s, active)).join("")}
       <div class="sec">Working set <span class="n">${WS.filter((w) => !w.attn).length}</span>
         <span class="end"><span class="qf on">All</span><span class="qf">${ic("loader", "s12")}2</span><span class="qf">${ic("pr", "s12")}3</span></span>
       </div>
       ${WS.filter((w) => !w.attn).map((s) => wsRow(s, active)).join("")}
       <div class="sec">Idle <span class="n">14</span><span class="end"><span class="qf">Show all</span></span></div>
       ${IDLE.map(([t, p, pr, age, d]) => flatRow(t, p, pr, age, d, "idle")).join("")}
       <div class="sec">${ic(opts.resolvedOpen ? "chev-d" : "chev-r", "s12")}Resolved <span class="n">23</span></div>
       ${opts.resolvedOpen ? RESOLVED.map(([t, p, pr, age, d]) => flatRow(t, p, pr, age, d, "resolved")).join("") : ""}`;
  return `
  <aside class="col side">
    <div class="head">
      <svg class="i s18"><use href="#i-logo"/></svg><span class="wordmark">cw-code</span>
      <span style="margin-left:auto" class="iconbtn" title="Hide sidebar">${ic("panel-l", "s14")}</span>
    </div>
    <div class="side-top">
      <div class="new-btn${active === "new" ? " on" : ""}">${ic("plus")}New session<span class="kbd">Ctrl T</span></div>
      <div class="sfield${opts.search ? " focus" : ""}">${ic("search", "s14")}${opts.search ? `<span style="color:var(--text)">slot</span><span class="caret"></span><span class="kbd">${ic("x", "s12")}</span>` : `<span class="search-ph">Search all sessions</span><span class="kbd">Ctrl K</span>`}</div>
      <div class="nav-row${active === "prs" ? " on" : ""}">${ic("pr")}Pull requests<span class="badge info">3</span></div>
    </div>
    <div class="side-scroll">${list}</div>
    <div class="upd"><span class="dot"></span><span><b>cw-code 0.15.0 is ready</b><small>Nothing restarts without you</small></span><span class="btn sm">Restart</span></div>
    <div class="side-foot">
      <span class="ghost${active === "settings" ? " on" : ""}">${ic("gear")}Settings</span>
      <span class="ghost${active === "usage" ? " on" : ""}">${ic("chart")}Usage</span>
      <span class="ghost${active === "skills" ? " on" : ""}" style="margin-left:auto">${ic("sparkle")}Skills</span>
    </div>
  </aside>`;
}

function gitbar() {
  return `<div class="gitbar">
    <span class="gchip icon" title="Worktree · cw/1d8f716e">${ic("fork", "s13")}</span>
    <span class="gchip">${ic("branch", "s13")}<span class="mono">cw/1d8f716e</span>${ic("chev-d", "s12 chev")}</span>
    <span class="gchip" title="PR #38 open · checks passing">${ic("circle-check", "s13 add")}#38</span>
    <span class="gchip"><span class="up">↑2</span><span style="color:var(--faint)">·</span><span class="add">+214</span><span class="del">−61</span></span>
    <span class="gchip" title="GitHub">${ic("pr", "s13")}${ic("chev-d", "s12 chev")}</span>
  </div>`;
}

function composer(o = {}) {
  const pills = `
    <span class="pill iconbtn">${ic("plus", "s18")}</span>
    ${o.harness ? `<span class="pill">${drv(o.driver, "s14")}${o.harness}${ic("chev-d", "s12 chev")}</span>` : ""}
    <span class="pill${o.modelOpen ? " on-pill" : ""}">${drv(o.driver || "claude", "s14")}${o.model || "Opus 5.5"}${ic("chev-d", "s12 chev")}</span>
    <span class="pill${o.effortOpen ? " on-pill" : ""}">${ic("gauge", "s14 dimtxt")}${o.effort || "High"}${(o.driver || "claude") === "claude" && o.ctxw !== "" ? `<span style="color:var(--faint)">·</span>${o.ctxw || "1M"}` : ""}${ic("chev-d", "s12 chev")}</span>
    <span class="pill">${ic(o.permIcon || "pencil", "s14 dimtxt")}${o.perm || "Auto-accept edits"}${ic("chev-d", "s12 chev")}</span>`;
  const action = o.running ? `<span class="stop" title="Stop response">${ic("stop", "s14")}</span>` : `<span class="send${o.off ? " off" : ""}">${ic("arrow-up", "s18")}</span>`;
  const ring = o.ring === false ? "" : `<span class="ring" title="Context window · ${o.ctx || 42}% used"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="#393b40" stroke-width="2.5"/><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="${(o.ctx || 42) * 0.44} 44" transform="rotate(-90 9 9)" stroke-linecap="round"/></svg></span>`;
  return `
  <div class="cwrap"><div class="cstack">
    ${o.dock || ""}
    <div class="hull${o.focus ? " focus" : ""}">
      <div class="write">${o.text ? `${o.text}<span class="caret"></span>` : `<span class="ph">${o.ph || "Ask cw-code — @ files, / commands, $ skills"}</span>`}</div>
      <div class="recipe">${pills}<span class="end">${ring}${action}</span></div>
    </div>
    ${o.after || ""}
  </div></div>`;
}

const todoDock = `
  <div class="dock">
    <div class="dock-row">${ic("todos", "s14")}<b>3 of 5</b><span>·</span><span style="color:var(--dim)">Align PR detail tab underline with the tab strips</span>

const RAIL_TOOLS = [
  [{ id: "overview", i: "overview", l: "Session overview" }, { id: "diff", i: "diff", l: "Git diff", badge: "6" }, { id: "pr", i: "pr", l: "Pull request #38", dot: "var(--run)" }, { id: "files", i: "folder", l: "Files" }, { id: "agents", i: "bot", l: "Subagents", badge: "2", run: 1 }],
  [{ id: "terminal", i: "terminal", l: "Terminal" }, { id: "cli", drvIcon: 1, l: "Harness CLI" }],
  [{ id: "preview", i: "eye", l: "Preview" }, { id: "skills", i: "sparkle", l: "Skills" }],
];
function rail(active = [], opts = {}) {
  const btn = (t) => `<span class="rail-b${active.includes(t.id) ? " on" : ""}${opts.elsewhere && opts.elsewhere.includes(t.id) ? " away" : ""}" title="${t.l}${opts.elsewhere && opts.elsewhere.includes(t.id) ? " · open in bottom panel" : ""}">${t.drvIcon ? drv(opts.driver || "claude", "s16") : ic(t.i, "s16")}${t.badge ? `<span class="rail-badge${t.run ? " run" : ""}">${t.badge}</span>` : ""}${t.dot ? `<span class="rail-dot" style="background:${t.dot}"></span>` : ""}</span>`;
  return `<nav class="rail">
      ${RAIL_TOOLS.map((g) => g.map(btn).join("")).join('<span class="rail-sep"></span>')}
      <span class="rail-end">
        <span class="rail-b${opts.split ? " on-soft" : ""}" title="Split the tool panel">${ic("split", "s16")}</span>
        <span class="rail-b${opts.collapsed ? "" : " on-soft"}" title="${opts.collapsed ? "Show" : "Hide"} tool panel">${ic("panel-r", "s16")}</span>
      </span>
    </nav>`;
}
function rightTabs(tabs, extra = "") {
  const t = tabs.find((x) => x.on) || tabs[0];
  return `<div class="phead">${t.drv ? drv(t.drv, "s16") : ic(t.i, "s16 ph-ic")}<span class="ph-t">${t.l}</span>${t.meta ? `<span class="ph-m">${t.meta}</span>` : ""}

];
function chart() {
  const W = 1060, H = 190, pl = 40, pb = 22, pt = 6, max = 8;
  const bw = 44, step = (W - pl) / DAYS.length;
  let bars = "";
  DAYS.forEach((d, i) => {
    let y = H - pb;
    const x = pl + i * step + (step - bw) / 2;
    SERIES.forEach((s, si) => {
      const h = (s.v[i] / max) * (H - pb - pt);
      const top = si === SERIES.length - 1;
      y -= h;
      const r = top ? 4 : 0;
      bars += top
        ? `<path d="M${x},${y + h - 2} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y + h - 2} Z" fill="${s.c}"/>`
        : `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0, h - 2)}" fill="${s.c}"/>`;
    });
    bars += `<rect class="hit" data-i="${i}" x="${pl + i * step}" y="${pt}" width="${step}" height="${H - pb - pt}" fill="transparent"/>`;
    if (i % 2 === 0) bars += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="#62666e" font-size="10.5" font-family="Inter">${d}</text>`;
  });
  let grid = "";
  [0, 2, 4, 6, 8].forEach((g) => {
    const y = H - pb - (g / max) * (H - pb - pt);
    grid += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="${g === 0 ? "#393b40" : "rgba(255,255,255,.05)"}"/><text x="${pl - 8}" y="${y + 3.5}" text-anchor="end" fill="#62666e" font-size="10.5" font-family="JetBrains Mono">${g}M</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" id="usage-svg">${grid}${bars}</svg>`;
}

const SANS_FONTS = [["", "Segoe UI", "Segoe UI"], ["\"Segoe UI Variable Text\"", "Segoe UI Variable Text"], ["Aptos", "Aptos"], ["Arial", "Arial"], ["Bahnschrift", "Bahnschrift"], ["Calibri", "Calibri"], ["Inter", "Inter"], ["Tahoma", "Tahoma"], ["Verdana", "Verdana"]];
const MONO_FONTS = [["", "JetBrains Mono", "JetBrains Mono"], ["\"Cascadia Code\"", "Cascadia Code"], ["\"Cascadia Mono\"", "Cascadia Mono"], ["Consolas", "Consolas"], ["\"Courier New\"", "Courier New"], ["\"Fira Code\"", "Fira Code"], ["\"Lucida Console\"", "Lucida Console"]];
const FONT_CHOICES = {
  sans: SANS_FONTS,
  mono: MONO_FONTS,
  prompt: [["", "Same as interface", "var(--sans)"], ...SANS_FONTS.slice(1), ...MONO_FONTS.slice(1, 3)],
  term: [["", "Same as monospace", "var(--mono)"], ...MONO_FONTS.slice(1)],
};
const SIZE_LIMITS = { interface: [12, 20, 16], code: [10, 18, 14], prompt: [12, 20, 14], term: [8, 20, 14] };
const APPEARANCE = { sans: "", mono: "", prompt: "", term: "", interface: 16, code: 14, prompt_size: 14, term_size: 14, advanced: false };

function fontLabel(kind) {
  const hit = FONT_CHOICES[kind].find(([v]) => v === APPEARANCE[kind]) || FONT_CHOICES[kind][0];
  return hit;
}
function fontSelect(kind) {
  const [v, label, face = label] = fontLabel(kind);
  const mono = kind === "mono" || kind === "term";
  return `<span class="fpick" data-pick="${kind}">
      <span class="fp-trig"><span class="fp-v" style="font-family:${face.startsWith("var(") ? face : `'${face}'`}">${label}</span>${v === "" ? '<span class="fp-def">default</span>' : ""}${ic("chev-d", "s12")}</span>
      <span class="fp-pop">
        <span class="fp-search">${ic("search", "s13")}<input placeholder="Search ${mono ? "monospace " : ""}fonts" data-fsearch /></span>
        <span class="fp-list">${FONT_CHOICES[kind].map(([val, l, f = l]) => `<span class="fp-it${val === APPEARANCE[kind] ? " on" : ""}" data-fv='${val}' data-fl="${l.toLowerCase()}"><span style="font-family:${f.startsWith("var(") ? f : `'${f}'`}">${l}</span>${val === "" ? '<span class="fp-def">default</span>' : ""}${val === APPEARANCE[kind] ? ic("check", "s13") : ""}</span>`).join("")}</span>
        <span class="fp-foot">${mono ? "Only fixed-width fonts are listed" : "Installed on this device"}</span>
      </span>
    </span>`;
}
function stepper(kind) {
  const key = kind === "prompt" ? "prompt_size" : kind === "term" ? "term_size" : kind;
  return `<span class="step"><button data-step="${kind}" data-d="-1" title="Smaller">${ic("min", "s12")}</button><span class="v" data-val="${kind}">${APPEARANCE[key]}</span><span class="u">px</span><button data-step="${kind}" data-d="1" title="Larger">${ic("plus", "s12")}</button></span>`;
}
function fontRow(title, desc, kind, sizeKind, preview) {
  return `<div class="frow">
      <div class="fr-h"><div class="lab">${title}<small>${desc}</small></div>
        <div class="fr-c">${fontSelect(kind)}${stepper(sizeKind)}<span class="iconbtn" data-reset="${kind}" title="Reset ${title.toLowerCase()}">${ic("history", "s14")}</span></div></div>
      ${preview}
    </div>`;
}

function applyAppearance() {
  const root = document.documentElement.style;
  APPEARANCE.sans ? root.setProperty("--font-sans", `${APPEARANCE.sans}, "Segoe UI", system-ui, sans-serif`) : root.removeProperty("--font-sans");
  APPEARANCE.mono ? root.setProperty("--font-mono", `${APPEARANCE.mono}, "JetBrains Mono", Consolas, monospace`) : root.removeProperty("--font-mono");
  APPEARANCE.prompt ? root.setProperty("--font-prompt", `${APPEARANCE.prompt}, var(--sans)`) : root.removeProperty("--font-prompt");
  APPEARANCE.term && APPEARANCE.advanced ? root.setProperty("--font-term", `${APPEARANCE.term}, var(--mono)`) : root.removeProperty("--font-term");
  root.fontSize = `${APPEARANCE.interface}px`;
  root.setProperty("--font-size-code", `${APPEARANCE.code}px`);
  root.setProperty("--font-size-prompt", `${APPEARANCE.advanced ? APPEARANCE.prompt_size : 14}px`);
  root.setProperty("--font-size-term", `${APPEARANCE.advanced ? APPEARANCE.term_size : APPEARANCE.code}px`);
  document.querySelectorAll("[data-val]").forEach((el) => {
    const k = el.dataset.val;
    el.textContent = APPEARANCE[k === "prompt" ? "prompt_size" : k === "term" ? "term_size" : k];
  });
}

function wireAppearance() {
  document.addEventListener("input", (e) => {
    const m = e.target.closest("[data-msearch]");
    if (m) {
      const term = m.value.trim().toLowerCase();
      m.closest(".mp").querySelectorAll(".mp-grp").forEach((g) => {
        let shown = 0;
        g.querySelectorAll(".mp-row").forEach((r) => { const ok = term === "" || r.dataset.mname.includes(term); r.hidden = !ok; if (ok) shown++; });
        g.hidden = shown === 0;
      });
      return;
    }
    const q = e.target.closest("[data-fsearch]");
    if (!q) return;
    const term = q.value.trim().toLowerCase();
    q.closest(".fp-pop").querySelectorAll(".fp-it").forEach((it) => { it.hidden = term !== "" && !it.dataset.fl.includes(term); });
  });
  document.addEventListener("click", (e) => {
    const item = e.target.closest(".fp-it");
    if (item) {
      const pick = item.closest(".fpick");
      APPEARANCE[pick.dataset.pick] = item.dataset.fv;
      pick.outerHTML = fontSelect(pick.dataset.pick);
      applyAppearance();
      return;
    }
    const trig = e.target.closest(".fp-trig");
    document.querySelectorAll(".fpick.open").forEach((o) => { if (!o.contains(e.target)) o.classList.remove("open"); });
    if (trig) {
      const pick = trig.closest(".fpick");
      pick.classList.toggle("open");
      if (pick.classList.contains("open")) pick.querySelector("[data-fsearch]").focus();
      return;
    }
    const stepBtn = e.target.closest("[data-step]");
    if (stepBtn) {
      const kind = stepBtn.dataset.step;
      const key = kind === "prompt" ? "prompt_size" : kind === "term" ? "term_size" : kind;
      const [min, max] = SIZE_LIMITS[kind];
      APPEARANCE[key] = Math.min(max, Math.max(min, APPEARANCE[key] + Number(stepBtn.dataset.d)));
      applyAppearance();
      return;
    }
    const reset = e.target.closest("[data-reset]");
    if (reset) {
      const kind = reset.dataset.reset;
      APPEARANCE[kind] = "";
      const sizeKind = { sans: "interface", mono: "code", prompt: "prompt", term: "term" }[kind];
      const key = sizeKind === "prompt" ? "prompt_size" : sizeKind === "term" ? "term_size" : sizeKind;
      APPEARANCE[key] = SIZE_LIMITS[sizeKind][2];
      document.querySelectorAll(`.fpick[data-pick="${kind}"]`).forEach((el) => { el.outerHTML = fontSelect(kind); });
      applyAppearance();
      return;
    }
    const adv = e.target.closest("[data-adv]");
    if (adv) {
      APPEARANCE.advanced = !APPEARANCE.advanced;
      adv.classList.toggle("on", APPEARANCE.advanced);
      document.querySelectorAll(".advrows").forEach((r) => { r.hidden = !APPEARANCE.advanced; });
      applyAppearance();
    }
  });
}

    <div class="caption"><div><h3>${s.name}</h3>${s.cap.what}</div>
      <div><h3>Borrowed</h3><ul>${s.cap.borrowed.map((x) => `<li>${x}</li>`).join("")}</ul></div>
      <div><h3>Changed vs today</h3><ul>${s.cap.changed.map((x) => `<li>${x}</li>`).join("")}</ul></div></div>`;
  stage.appendChild(el);
});
const hint = document.createElement("span");
hint.className = "hint";
hint.textContent = "← → to switch · static mockup, not wired";
nav.appendChild(hint);

function fit() {
  const avail = Math.min(window.innerWidth - 36, 1440);
  const z = avail / 1440;
  document.querySelectorAll(".fit, .caption").forEach((el) => { el.style.zoom = z; });
}
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === `screen-${id}`));
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  history.replaceState(null, "", `#${id}`);
}
window.addEventListener("resize", fit);
wireAppearance();
applyAppearance();
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-demo]");
  if (!d) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (d.dataset.demo === "pop") {
    const pop = document.getElementById("mo-pop");
    pop.classList.add("enter");
    void pop.offsetWidth;
    pop.classList.remove("enter");
  }
  if (d.dataset.demo === "reorder") {
    const list = document.getElementById("mo-list");
    const rows = [...list.children];
    const first = new Map(rows.map((r) => [r, r.getBoundingClientRect().top]));
    list.appendChild(rows[0]);
    if (reduce) return;
    const z = parseFloat(list.closest(".fit").style.zoom) || 1;
    [...list.children].forEach((r) => {
      const dy = (first.get(r) - r.getBoundingClientRect().top) / z;
      if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 150, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
    });
  }
  if (d.dataset.demo === "fold") {
    const fold = document.getElementById("mo-fold");
    const chev = document.getElementById("mo-chev");
    const open = !chev.classList.contains("open");
    chev.classList.toggle("open", open);
    const full = fold.scrollHeight;
    if (open) { fold.style.height = "0px"; void fold.offsetWidth; fold.style.height = full + "px"; }
    else { fold.style.height = full + "px"; void fold.offsetWidth; fold.style.height = "0px"; }
  }
});

window.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = SCREENS.map((s) => s.id);
  const cur = ids.indexOf(location.hash.slice(1));
  const next = (Math.max(cur, 0) + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length;
  show(ids[next]);
});
show(SCREENS.some((s) => s.id === location.hash.slice(1)) ? location.hash.slice(1) : "workbench");
fit();

const tip = document.getElementById("tip");
const box = document.getElementById("usage-chart");
box.addEventListener("mousemove", (e) => {
  const hit = e.target.closest(".hit");
  if (!hit) { tip.style.display = "none"; return; }
  const i = +hit.dataset.i;
  const tot = SERIES.reduce((a, s) => a + s.v[i], 0);
  tip.innerHTML = `<div style="font-weight:650;color:var(--text)">${DAYS[i]}</div>${SERIES.slice().reverse().map((s) => `<div class="tr"><i style="background:${s.c}"></i>${s.k}<b>${s.v[i].toFixed(1)}M</b></div>`).join("")}<div class="tr" style="border-top:1px solid var(--soft);padding-top:4px;margin-top:5px">Total<b>${tot.toFixed(1)}M</b></div>`;
  const r = box.getBoundingClientRect();
  const z = parseFloat(box.closest(".fit").style.zoom) || 1;
  const x = (e.clientX - r.left) / z, y = (e.clientY - r.top) / z;
  tip.style.display = "block";
  tip.style.left = `${Math.min(x + 14, 900)}px`;
  tip.style.top = `${y + 10}px`;
});
box.addEventListener("mouseleave", () => { tip.style.display = "none"; });
document.getElementById("viewseg").addEventListener("click", (e) => {
  const v = e.target.closest("[data-v]")?.dataset.v;
  if (!v) return;
  document.querySelectorAll("#viewseg span").forEach((s) => s.classList.toggle("on", s.dataset.v === v));
  document.getElementById("chart-view").style.display = v === "chart" ? "" : "none";
  document.getElementById("table-view").style.display = v === "table" ? "" : "none";
});
</script>
</body>
</html>
