<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>cw-code · design pass mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --gutter: #080a0f;
  --line: #222630;
  --editor: #101219;
  --head: #12141c;
  --bg: #151820;
  --panel: #181b24;
  --well: #151922;
  --card: #1b202b;
  --deep: #1f2330;
  --umsg: #232735;
  --composer: #242734;
  --hover: #1d2029;
  --raised: #262a36;
  --border: #303440;
  --soft: #252a36;
  --hair: rgba(255, 255, 255, 0.05);
  --text: #e9eaf0;
  --dim: #bdc0cc;
  --muted: #8a8fa0;
  --faint: #5f6476;
  --violet: #795cec;
  --violet-strong: #6146d6;
  --violet-ink: #a18cff;
  --violet-soft: rgba(121, 92, 236, 0.2);
  --violet-line: rgba(161, 140, 255, 0.45);
  --claude: #e8835a;
  --opencode: #5ab8ff;
  --codex: #b49cff;
  --run: #59a659;
  --approval: #e8b44f;
  --input: #548af7;
  --fail: #e06c60;
  --font-sans-default: "Segoe UI", system-ui, sans-serif;
  --font-mono-default: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --sans: var(--font-sans, var(--font-sans-default));
  --mono: var(--font-mono, var(--font-mono-default));
  --prompt-font: var(--font-prompt, var(--sans));
  --term-font: var(--font-term, var(--mono));
  --t-3xs: 0.625rem;
  --t-2xs: 0.6875rem;
  --t-xs: 0.75rem;
  --t-desc: 0.8125rem;
  --t-sm: 0.875rem;
  --t-base: 1rem;
  --t-lg: 1.125rem;
  --t-xl: 1.25rem;
  --t-2xl: 1.5rem;
  --fs-code: var(--font-size-code, 14px);
  --fs-prompt: var(--font-size-prompt, 14px);
  --fs-term: var(--font-size-term, var(--fs-code));
  --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-modal: 0 28px 90px rgba(0, 0, 0, 0.65);
}
* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { margin: 0; background: #06070a; color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { font-size: var(--t-sm); line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i.s12 { width: 12px; height: 12px; } .i.s13 { width: 13px; height: 13px; } .i.s14 { width: 14px; height: 14px; } .i.s16 { width: 16px; height: 16px; } .i.s18 { width: 18px; height: 18px; } .i.s22 { width: 22px; height: 22px; }
.fill { fill: currentColor; stroke: none; }
.d-claude { color: var(--claude); } .d-opencode { color: var(--opencode); } .d-codex { color: var(--codex); }
.mono { font-family: var(--mono); }
.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.35; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .spin, .pulse, .shimmer { animation: none !important; } }

/* ---------- presentation chrome (outside the app) ---------- */
.deck-nav, .caption { font-family: Inter, system-ui, sans-serif; }
.deck-nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 4px; padding: 10px 18px; background: rgba(8, 10, 15, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #161922; overflow-x: auto; }
.deck-nav .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; margin-right: 14px; white-space: nowrap; }
.deck-nav button { padding: 6px 11px; border-radius: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.deck-nav button:hover { color: var(--text); background: #151820; }
.deck-nav button.on { color: var(--text); background: var(--violet-soft); }
.deck-nav .hint { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.stage { padding: 22px 18px 40px; }
.screen { display: none; }
.screen.on { display: block; }
.fit { width: 1440px; margin: 0 auto; transform-origin: top left; }
.caption { width: 1440px; margin: 14px auto 0; display: grid; grid-template-columns: 220px 1fr 1fr; gap: 24px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.caption h3 { margin: 0; font-size: 13px; color: var(--text); font-weight: 650; }
.caption b { color: var(--dim); font-weight: 600; }
.caption ul { margin: 0; padding-left: 16px; }

/* ---------- app frame ---------- */
.app { position: relative; width: 1440px; height: 900px; background: var(--line); display: grid; grid-template-columns: 288px 1fr var(--rw, 468px); gap: 1px; overflow: hidden; border-radius: 10px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.app.no-right { grid-template-columns: 288px 1fr; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.winctl { position: absolute; top: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 2px; padding-right: 4px; z-index: 5; }
.winctl span { width: 44px; height: 32px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }

/* sidebar */
.side { background: var(--bg); }
.side .head { gap: 9px; }
.wordmark { font-size: var(--t-sm); font-weight: 650; letter-spacing: -0.01em; }
.side-top { padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.new-btn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-bottom: 6px; border-radius: 8px; background: var(--hover); font-size: var(--t-sm); font-weight: 600; color: var(--text); }
.new-btn.on { background: var(--violet-soft); }
.new-btn.on .i { color: var(--violet-ink); }
.kbd { margin-left: auto; font-family: var(--mono); font-size: var(--t-3xs); color: var(--faint); }
.sfield { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-bottom: 6px; border-radius: 8px; background: var(--hover); box-shadow: inset 0 0 0 1px var(--border); font-size: var(--t-sm); color: var(--muted); }
.sfield.focus { box-shadow: inset 0 0 0 1px var(--violet-line), 0 0 0 3px rgba(121, 92, 236, 0.14); }
.sfield .search-ph { color: var(--faint); }
.ws .r .rr { display: flex; align-items: center; gap: 8px; }
.ws .m .sepdot { color: #3d4252; }
.prc.rev { color: var(--input); }
mark { background: rgba(232, 180, 79, 0.2); color: var(--text); border-radius: 3px; padding: 0 1px; }
.ghost.on { background: var(--violet-soft); color: var(--text); }
.ghost.on .i { color: var(--violet-ink); }
.srow.flat { height: 30px; font-size: var(--t-sm); }
.srow.idle .t, .srow.resolved .t { color: #9398a8; }
.srow .proj-n { margin-left: 7px; font-size: var(--t-xs); color: var(--faint); }
.st.res { color: var(--faint); font-weight: 500; }
.upd { margin: 0 10px; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--hover); display: flex; align-items: center; gap: 10px; }
.upd .dot { background: var(--violet-ink); }
.upd > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.upd b { font-size: var(--t-xs); font-weight: 600; color: var(--text); }
.upd small { font-size: var(--t-2xs); color: var(--faint); }
.nav-row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 6px; font-size: var(--t-sm); color: var(--dim); }
.nav-row .i { color: var(--muted); }
.nav-row:hover { background: var(--hover); }
.nav-row.on { background: var(--violet-soft); color: var(--text); }
.nav-row.on .i { color: var(--violet-ink); }
.nav-row .search-ph { color: var(--faint); }
.badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--raised); color: var(--dim); font-size: var(--t-3xs); font-weight: 700; display: grid; place-items: center; }
.badge.info { background: var(--input); color: #fff; }
.side-scroll { flex: 1; overflow: hidden; padding: 0 10px; }
.sec { display: flex; align-items: center; gap: 6px; padding: 14px 8px 6px; font-size: var(--t-3xs); font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.sec .n { letter-spacing: 0; font-weight: 600; }
.sec .end { margin-left: auto; display: flex; gap: 4px; align-items: center; text-transform: none; letter-spacing: 0; }
.qf { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 5px; font-size: var(--t-2xs); font-weight: 600; color: var(--muted); }
.qf.on { background: var(--violet-soft); color: var(--text); }
.ws { display: flex; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 8px; position: relative; }
.ws:hover { background: var(--hover); }
.ws .body { flex: 1; min-width: 0; }
.ws .t { font-size: var(--t-sm); font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .m { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: var(--t-xs); color: var(--faint); white-space: nowrap; overflow: hidden; }
.ws .m .mono { font-size: var(--t-2xs); overflow: hidden; text-overflow: ellipsis; }
.ws .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.on-row { background: var(--violet-soft) !important; }
.on-row::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--violet); }
.av { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: var(--t-3xs); font-weight: 800; color: rgba(255, 255, 255, 0.92); flex: none; }
.av.lg { width: 18px; height: 18px; border-radius: 5px; }
.st { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.st.run { color: var(--run); } .st.appr { color: var(--approval); } .st.input { color: var(--input); } .st.fail { color: var(--fail); } .st.age { color: var(--faint); font-weight: 500; } .st.done { color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.unseen { background: var(--input); }
.proj { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin-top: 6px; border-radius: 6px; font-size: var(--t-sm); font-weight: 600; color: var(--dim); }
.proj:hover { background: var(--hover); }
.proj .n { font-weight: 500; color: var(--faint); font-size: var(--t-xs); }
.proj .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.proj .chev { color: var(--faint); }
.srow { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 34px; border-radius: 7px; font-size: var(--t-sm); color: var(--dim); }
.srow:hover { background: var(--hover); }
.srow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow.idle .t { color: #8d929c; }
.srow.on-row .t { color: var(--text); }
.srow.on-row::before { left: 24px; }
.srow.flat { padding-left: 10px; }
.srow.flat.on-row::before { left: 0; }
.prc { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-2xs); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.prc.ok { color: var(--run); } .prc.bad { color: var(--fail); } .prc.merged { color: var(--codex); }
.side-foot { display: flex; align-items: center; gap: 2px; padding: 8px 10px 10px; }
.ghost { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 7px; font-size: var(--t-sm); font-weight: 500; color: var(--muted); }
.ghost:hover { background: var(--hover); color: var(--text); }
.update-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--violet-soft); color: var(--text); font-size: var(--t-xs); font-weight: 600; }
.update-pill .dot { background: var(--violet-ink); }

/* main column */
.main { background: var(--editor); position: relative; }
.main > .head { background: var(--head); box-shadow: inset 0 -1px 0 var(--line); }
.crumb { display: flex; align-items: center; gap: 7px; font-size: var(--t-sm); color: var(--faint); min-width: 0; white-space: nowrap; }
.crumb .p { color: var(--muted); }
.crumb strong { color: var(--dim); font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
.gitbar { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.045); color: var(--dim); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.gchip.icon { width: 24px; padding: 0; justify-content: center; }
.gchip .mono { font-weight: 500; font-size: var(--t-xs); }
.gchip .add { color: var(--run); } .gchip .del { color: var(--fail); } .gchip .up { color: var(--run); }
.gchip .chev { color: var(--faint); }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
.iconbtn:hover, .iconbtn.on { background: var(--raised); color: var(--text); }
.thread { flex: 1; overflow: hidden; position: relative; }
.main > .thread::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--editor)); pointer-events: none; }
.measure { width: 100%; max-width: 780px; margin: 0 auto; padding: 22px 28px 0; display: flex; flex-direction: column; gap: 16px; }
.umsg { align-self: flex-end; max-width: 82%; background: var(--umsg); border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: var(--t-sm); line-height: 1.55; color: #e6e7ea; }
.turn-head { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: #9aa3bb; }
.turn-head .sep { color: var(--faint); }
.turn-head .tail { margin-left: auto; color: var(--faint); display: flex; align-items: center; gap: 4px; font-size: var(--t-xs); }
.shimmer { background: linear-gradient(90deg, #9aa3bb 0%, #9aa3bb 40%, #f1efff 50%, #9aa3bb 60%, #9aa3bb 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
.amsg { font-size: var(--t-sm); line-height: 1.65; color: var(--text); }
.amsg p { margin: 0 0 10px; }
.amsg ul { margin: 0 0 10px; padding-left: 20px; }
.amsg li { margin: 3px 0; }
.amsg li::marker { color: var(--faint); }
code.ic { font-family: var(--mono); font-size: var(--t-sm); background: var(--hover); border: 1px solid var(--soft); border-radius: 5px; padding: 1px 5px; color: #d6d8dd; }
.codeblk { background: var(--well); border: 1px solid var(--soft); border-radius: 10px; overflow: hidden; margin: 4px 0 10px; }
.codeblk .ch { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 12px; font-family: var(--mono); font-size: var(--t-2xs); color: var(--faint); }
.codeblk .ch .end { margin-left: auto; }
.codeblk pre { margin: 0; padding: 4px 14px 12px; font-family: var(--mono); font-size: var(--t-xs); line-height: 1.6; color: var(--dim); }
.k { color: #cf8e6d; } .s { color: #6aab73; } .nm { color: #2aacb8; } .c { color: #7a7e85; } .f { color: #56a8f5; } .ty { color: #c77dbb; }
.changes { border-radius: 10px; background: var(--card); overflow: hidden; }
.changes .hd { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 12px; font-size: var(--t-sm); color: var(--dim); }
.changes .hd b { color: var(--text); font-weight: 600; }
.changes .hd .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.changes .fl { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; font-family: var(--mono); font-size: var(--t-xs); color: var(--dim); }
.changes .fl:hover { background: var(--hover); }
.changes .fl .dir { color: var(--faint); }
.changes .fl .end { margin-left: auto; }
.add { color: var(--run); } .del { color: var(--fail); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 7px; font-size: var(--t-sm); font-weight: 600; color: var(--dim); background: rgba(255, 255, 255, 0.05); white-space: nowrap; }
.btn:hover { background: var(--raised); color: var(--text); }
.btn.primary { background: linear-gradient(135deg, var(--violet), var(--violet-strong)); color: #fff; }
.btn.danger { color: var(--fail); background: rgba(224, 108, 96, 0.1); }
.btn.sm { height: 24px; padding: 0 8px; font-size: var(--t-xs); }
.trow { display: flex; align-items: center; gap: 8px; height: 27px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; font-size: var(--t-sm); color: var(--muted); }
.trow:hover { background: rgba(255, 255, 255, 0.03); }
.trow .v { color: var(--dim); font-weight: 600; }
.trow .subj { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .dur { margin-left: auto; font-size: var(--t-xs); color: var(--faint); font-variant-numeric: tabular-nums; }
.trow.running { background: linear-gradient(90deg, rgba(255, 255, 255, 0.035), transparent 70%); }
.trow.wait { color: var(--approval); }
.trow .ok { color: var(--faint); }
.work { display: flex; flex-direction: column; gap: 1px; padding-left: 2px; }

/* composer */
.cwrap { flex: none; padding: 10px 28px 16px; }
.cstack { max-width: 780px; margin: 0 auto; }
.dock { margin: 0 14px; border-radius: 12px 12px 0 0; background: #1b1e29; border: 1px solid var(--soft); border-bottom: 0; }
.dock-row { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 12px; font-size: var(--t-sm); color: var(--muted); }
.dock-row b { color: var(--dim); font-weight: 600; white-space: nowrap; }
.dock-row { white-space: nowrap; }
.dock-row .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.meter { height: 3px; border-radius: 2px; background: #2a2e3b; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--run); border-radius: 2px; }
.hull { position: relative; border-radius: 14px; background: var(--composer); border: 1px solid #2f3342; box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45); }
.hull.focus { border-color: rgba(161, 140, 255, 0.6); box-shadow: 0 0 0 1px rgba(161, 140, 255, 0.3), 0 16px 42px rgba(0, 0, 0, 0.55); }
.hull .write { padding: 14px 16px 4px; min-height: 58px; font-size: var(--t-sm); line-height: 1.5; color: #f1f1f6; }
.hull .ph { color: #7c808a; }
.caret { display: inline-block; width: 1.5px; height: 17px; background: var(--violet-ink); vertical-align: -3px; margin-left: 1px; animation: pulse 1s steps(1) infinite; }
.recipe { display: flex; align-items: center; gap: 2px; padding: 4px 8px 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 8px; font-size: var(--t-sm); color: #e4e4ec; white-space: nowrap; }
.pill:hover { background: rgba(255, 255, 255, 0.06); }
.pill .chev { color: var(--faint); }
.pill .dimtxt { color: var(--muted); }
.recipe .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ring { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: #9da1a8; }
.send { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--violet), var(--violet-strong)); box-shadow: 0 4px 14px rgba(111, 55, 255, 0.34); }
.send.off { opacity: 0.36; box-shadow: none; }
.stop { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #ffd9d4; background: #4a2227; }
.wsbar { margin: 0 14px; border-radius: 0 0 12px 12px; background: #1b1e29; border: 1px solid var(--soft); border-top: 0; display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 8px; }

/* right workspace */
.right { background: var(--panel); }
.rtabs { height: 40px; flex: none; display: flex; align-items: stretch; padding: 0 142px 0 6px; gap: 0; }
.tab { display: flex; align-items: center; gap: 7px; padding: 0 11px; font-size: var(--t-xs); font-weight: 600; color: var(--faint); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--dim); }
.tab.on { color: var(--text); border-bottom-color: var(--violet); }
.tab.on > .i:not(.d-claude):not(.d-codex):not(.d-opencode) { color: var(--violet-ink); }
.tab .ct { font-weight: 600; font-size: var(--t-3xs); color: var(--faint); }
.rtabs .tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane + .pane { border-top: 1px solid var(--line); }
.ptool { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--well); }
.seg span { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 6px; font-size: var(--t-xs); font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg span.on { background: var(--raised); color: var(--text); }
.seg span .ct { font-size: var(--t-3xs); color: var(--faint); }
.ptool .end { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--faint); }
.dscroll { flex: 1; overflow: hidden; background: var(--well); }
.dfile { border-bottom: 1px solid var(--line); }
.dfh { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; background: var(--panel); font-size: var(--t-xs); color: var(--dim); position: sticky; top: 0; }
.dfh .dir { color: var(--faint); }
.dfh .end { margin-left: auto; display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: var(--t-2xs); }
.dl { display: grid; grid-template-columns: 3.3em 3.3em 1fr; font-family: var(--mono); font-size: var(--t-xs); line-height: 19px; color: var(--dim); white-space: pre; }

.dl.a { background: rgba(89, 166, 89, 0.11); } .dl.a span:last-child { color: #b9d9b9; }
.dl.d { background: rgba(224, 108, 96, 0.11); } .dl.d span:last-child { color: #e6aaa3; }
.dl.h { background: rgba(84, 138, 247, 0.07); } .dl.h span:last-child { color: #7aa5f8; }
.dfile.collapsed .dl { display: none; }
.editor { flex: 1; background: var(--well); overflow: hidden; padding-top: 6px; }
.eline { display: grid; grid-template-columns: 3.6em 1fr; font-family: var(--mono); font-size: var(--t-xs); line-height: 20px; white-space: pre; color: var(--dim); }
.eline span:first-child { text-align: right; padding-right: 14px; color: #4a4f60; }
.eline.mod { background: rgba(89, 166, 89, 0.08); box-shadow: inset 2px 0 0 var(--run); }
.term { flex: 1; background: var(--panel); padding: 8px 12px; font-family: var(--mono); font-size: var(--t-sm); line-height: 1.55; color: var(--dim); white-space: pre; overflow: hidden; }
.term .pr { color: #56a8f5; } .term .g { color: var(--run); } .term .y { color: var(--approval); } .term .f { color: var(--faint); }
.subtabs { height: 34px; flex: none; display: flex; align-items: stretch; padding: 0 6px; }
.subtabs .tab { font-size: var(--t-xs); padding: 0 10px; }
.subtabs .tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }

/* docks */
.apprdock { margin: 0 14px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, rgba(232, 180, 79, 0.09), rgba(232, 180, 79, 0.035)), #1c1b19; border: 1px solid rgba(232, 180, 79, 0.42); border-bottom: 0; padding: 10px 12px 12px; }
.apprdock .hd { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); font-weight: 700; color: var(--approval); }
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-size: var(--t-3xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255, 255, 255, 0.06); color: var(--muted); }
.apprdock .hd .end { margin-left: auto; font-weight: 500; color: var(--faint); font-size: var(--t-xs); }
.apprdock pre { margin: 8px 0 6px; padding: 9px 11px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); font-family: var(--mono); font-size: var(--t-xs); color: #ece6d6; white-space: pre-wrap; }
.apprdock .meta { font-size: var(--t-xs); color: var(--muted); }
.apprdock .acts { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.apprdock .acts .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.btn.amber { background: var(--approval); color: #201b10; }
.kh { font-family: var(--mono); font-size: var(--t-3xs); color: var(--faint); margin-left: 2px; }
.btn.amber .kh { color: rgba(32, 27, 16, 0.6); }
.q { margin: 0 14px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, rgba(84, 138, 247, 0.09), rgba(84, 138, 247, 0.03)), #181b26; border: 1px solid rgba(84, 138, 247, 0.42); border-bottom: 0; padding: 10px 12px 12px; }
.q .hd { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); font-weight: 700; color: #8fb2fa; }
.q .hd .end { margin-left: auto; font-weight: 500; color: var(--faint); font-size: var(--t-xs); }
.q .qt { font-size: var(--t-sm); color: var(--text); margin: 8px 0; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 7px 9px; border-radius: 8px; font-size: var(--t-sm); color: var(--dim); }
.opt.on { background: rgba(84, 138, 247, 0.1); color: var(--text); }
.opt small { display: block; color: var(--faint); font-size: var(--t-xs); margin-top: 1px; }
.prdock { margin: 0 14px; border-radius: 12px 12px 0 0; background: #181b26; border: 1px solid rgba(84, 138, 247, 0.3); border-bottom: 0; }

/* pages */
.page { flex: 1; overflow: hidden; }
.page-in { max-width: 1120px; margin: 0 auto; padding: 18px 28px; }
.h1 { font-size: var(--t-xl); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { font-size: var(--t-sm); color: var(--muted); margin-top: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 14px; font-size: var(--t-sm); color: var(--muted); background: rgba(255, 255, 255, 0.035); }
.fchip b { color: var(--dim); font-weight: 650; }
.fchip.on { background: var(--violet-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--violet-line); }
.fchip.on b { color: var(--text); }
.grp { margin-top: 18px; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-size: var(--t-sm); font-weight: 650; color: var(--dim); }
.grp-h .n { color: var(--faint); font-weight: 500; }
.grp-h .end { margin-left: auto; font-family: var(--mono); font-size: var(--t-2xs); color: var(--faint); font-weight: 400; }
.rows { background: var(--well); border-radius: 10px; overflow: hidden; }
.prstate { position: relative; display: grid; place-items: center; }
.prstate .dot { position: absolute; top: -3px; right: -4px; width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--well); }
.prrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) 164px 96px 156px 176px; align-items: center; gap: 10px; padding: 9px 12px 9px 12px; }
.prrow + .prrow { box-shadow: inset 0 1px 0 var(--hair); }
.prrow:hover { background: var(--hover); }
.prrow .t { font-size: var(--t-sm); font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prrow.seen .t { color: var(--dim); font-weight: 450; }
.prrow .m { font-size: var(--t-xs); color: var(--faint); margin-top: 2px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
.prrow .sig { font-size: var(--t-xs); display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ava { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: var(--t-3xs); font-weight: 750; color: #fff; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
.wn { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.wn b { font-size: var(--t-sm); font-weight: 550; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wn span { font-size: var(--t-2xs); color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl { font-size: var(--t-3xs); padding: 1px 6px; border-radius: 9px; background: rgba(255, 255, 255, 0.06); color: var(--muted); font-weight: 550; }
.split { display: inline-flex; border-radius: 7px; overflow: hidden; }
.split .btn { border-radius: 0; }
.split .btn + .btn { padding: 0 6px; box-shadow: inset 1px 0 0 rgba(0, 0, 0, 0.25); }
.tabs2 { display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--soft); margin-top: 16px; }
.tabs2 .tab { height: 38px; font-size: var(--t-sm); }
.tabs2 .end { margin-left: auto; align-self: center; font-family: var(--mono); font-size: var(--t-xs); }
.pill-state { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: var(--t-xs); font-weight: 650; }
.pill-state.open { background: rgba(89, 166, 89, 0.16); color: #8fcf8f; }
.tl { position: relative; padding-left: 34px; }
.tl::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--soft); }
.tle { position: relative; display: flex; align-items: center; gap: 8px; min-height: 34px; font-size: var(--t-sm); color: var(--muted); }
.tle .ico { position: absolute; left: -34px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); box-shadow: 0 0 0 3px var(--editor); }
.tle b { color: var(--dim); font-weight: 600; }
.card { background: var(--well); border-radius: 10px; overflow: hidden; }
.card .ch { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; font-size: var(--t-sm); color: var(--muted); background: rgba(255, 255, 255, 0.02); }

.aside h4 { margin: 0 0 8px; font-size: var(--t-2xs); letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); font-weight: 650; display: flex; align-items: center; }
.aside h4 .n { margin-left: 6px; letter-spacing: 0; }
.aside section { padding: 14px 0; box-shadow: inset 0 -1px 0 var(--hair); }
.aside .li { display: flex; align-items: center; gap: 8px; height: 28px; font-size: var(--t-sm); color: var(--dim); }
.aside .li .end { margin-left: auto; }
.kv { display: grid; grid-template-columns: 90px 1fr; row-gap: 6px; font-size: var(--t-xs); }
.kv span:nth-child(odd) { color: var(--faint); }
.kv span:nth-child(even) { color: var(--dim); font-family: var(--mono); font-size: var(--t-xs); }

/* usage */
.limits { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--well); border-radius: 12px; margin-top: 12px; }
.limit { padding: 16px 18px 14px; }
.limit + .limit { box-shadow: inset 1px 0 0 var(--hair); }
.limit .lh { display: flex; align-items: center; gap: 9px; font-size: var(--t-sm); font-weight: 650; color: var(--text); margin-bottom: 14px; }
.tile { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.tile.claude { background: rgba(232, 131, 90, 0.14); } .tile.codex { background: rgba(180, 156, 255, 0.14); } .tile.opencode { background: rgba(90, 184, 255, 0.14); }
.plan { margin-left: auto; font-size: var(--t-2xs); font-weight: 600; color: var(--muted); padding: 2px 7px; border-radius: 9px; background: rgba(255, 255, 255, 0.05); }
.um { margin-bottom: 12px; }
.um .row { display: flex; align-items: baseline; font-size: var(--t-sm); color: var(--dim); margin-bottom: 6px; }
.um .row .v { margin-left: auto; font-family: var(--mono); font-size: var(--t-xs); color: var(--text); }
.track { height: 6px; background: #262a36; border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; }
.um .rs { font-size: var(--t-xs); color: var(--faint); margin-top: 5px; }
.warn-tag { font-size: var(--t-2xs); font-weight: 650; color: var(--approval); margin-left: 8px; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; margin: 18px 0 8px; padding: 0 4px; }
.kpi .l { font-size: var(--t-xs); color: var(--muted); }
.kpi .v { font-size: var(--t-2xl); font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .s { font-size: var(--t-xs); color: var(--faint); margin-top: 2px; }
.chartbox { background: var(--well); border-radius: 12px; padding: 14px 16px 10px; margin-top: 12px; position: relative; }
.chartbox .cht { display: flex; align-items: center; gap: 16px; font-size: var(--t-sm); color: var(--dim); font-weight: 600; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-weight: 500; color: var(--muted); font-size: var(--t-xs); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.tip { position: absolute; pointer-events: none; background: var(--deep); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: var(--t-xs); box-shadow: var(--shadow-float); display: none; min-width: 150px; z-index: 3; }
.tip .tr { display: flex; gap: 8px; align-items: center; color: var(--dim); margin-top: 3px; }
.tip .tr i { width: 8px; height: 8px; border-radius: 2px; }
.tip .tr b { margin-left: auto; font-family: var(--mono); font-weight: 500; color: var(--text); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
table.t th { text-align: left; font-weight: 600; color: var(--faint); font-size: var(--t-xs); padding: 6px 8px; }
table.t td { padding: 7px 8px; color: var(--dim); box-shadow: inset 0 1px 0 var(--hair); }
table.t td.num, table.t th.num { text-align: right; font-family: var(--mono); font-size: var(--t-xs); }

/* modals */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.58); backdrop-filter: blur(3px); z-index: 10; display: grid; place-items: center; }
.modal { background: var(--deep); border-radius: 14px; box-shadow: var(--shadow-modal), inset 0 0 0 1px rgba(255, 255, 255, 0.06); overflow: hidden; display: flex; flex-direction: column; }
.mh { height: 50px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px; font-size: var(--t-sm); font-weight: 650; }
.mh .end { margin-left: auto; }
.mbody { flex: 1; display: flex; min-height: 0; }
.snav { width: 216px; flex: none; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.snav .glabel { font-size: var(--t-3xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 650; padding: 14px 10px 6px; }
.sitem { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border-radius: 7px; font-size: var(--t-sm); color: var(--dim); }
.sitem .i { color: var(--muted); }
.sitem:hover { background: var(--hover); }
.sitem.on { background: var(--violet-soft); color: var(--text); }
.sitem.on .i:not(.d-claude):not(.d-codex):not(.d-opencode) { color: var(--violet-ink); }
.scontent { flex: 1; overflow: hidden; padding: 8px 32px 24px; background: var(--bg); border-radius: 12px 0 0 0; }
.scontent h2 { font-size: var(--t-lg); font-weight: 650; margin: 16px 0 2px; display: flex; align-items: center; gap: 10px; }
.shint { font-size: var(--t-sm); color: var(--muted); }
.sgroup { margin-top: 22px; }
.sgroup h5 { margin: 0 0 4px; font-size: var(--t-2xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.srowset { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: center; padding: 12px 0; box-shadow: inset 0 -1px 0 var(--hair); }
.srowset .lab { font-size: var(--t-sm); font-weight: 600; color: var(--text); }
.srowset .lab small { display: block; font-size: var(--t-xs); color: var(--faint); font-weight: 400; margin-top: 2px; }
.field { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--soft); font-size: var(--t-sm); color: var(--dim); }
.field.mono { font-family: var(--mono); font-size: var(--t-xs); }
.field.focus { box-shadow: inset 0 0 0 1px var(--violet-line), 0 0 0 3px rgba(124, 66, 255, 0.14); }
.ok-note { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--run); }
.switch { width: 34px; height: 20px; border-radius: 10px; background: #2a2e3b; box-shadow: inset 0 0 0 1.5px #4a4f62; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #9da1a8; }
.switch.on { background: var(--violet); box-shadow: none; }

.mlist .mrow { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: var(--t-sm); color: var(--dim); }
.mlist .mrow + .mrow { box-shadow: inset 0 1px 0 var(--hair); }
.mlist .mrow .end { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: var(--t-xs); }
.star { color: var(--approval); }
.mfoot { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.mfoot .end { margin-left: auto; display: flex; gap: 8px; }
.btn.lg { height: 32px; padding: 0 14px; font-size: var(--t-sm); }


/* settings page */
.glabel { font-size: var(--t-3xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 650; padding: 14px 10px 6px; }
.sitem .sv { margin-left: auto; font-family: var(--mono); font-size: var(--t-3xs); color: var(--faint); }
.sitem .sv.warn { color: var(--approval); }
.set-in { flex: 1; min-height: 0; overflow: auto; width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 32px 0; display: flex; flex-direction: column; }
.gstrip { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--well); border-radius: 12px; margin-top: 16px; flex: none; }
.gcol { padding: 12px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.gcol + .gcol { box-shadow: inset 1px 0 0 var(--hair); }
.gcol h5 { margin: 0 0 2px; display: flex; align-items: center; gap: 7px; font-size: var(--t-2xs); letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.gcol .lab2 { font-size: var(--t-sm); font-weight: 600; color: var(--dim); }
.gcol small { font-size: var(--t-xs); color: var(--faint); }
.gcol .field { height: 30px; }
.md { flex: none; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; margin-top: 18px; }
.md-list { display: flex; flex-direction: column; gap: 2px; }
.md-h { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 650; color: var(--dim); padding: 0 6px 8px; }
.md-h .n { color: var(--faint); font-weight: 500; }
.md-h .end { margin-left: auto; }
.wf { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 6px; border-radius: 8px; }
.wf:hover { background: var(--hover); }
.wf .grip { color: #3d4252; }
.wf-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); color: var(--dim); flex: none; }
.wf-ic.lg { width: 68px; height: 68px; border-radius: 12px; }
.wf.on-row .wf-ic { background: rgba(121, 92, 236, 0.28); color: var(--violet-ink); }
.wf-b { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wf-b b { font-size: var(--t-sm); font-weight: 600; color: var(--text); }
.wf-b span { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.md-ed { background: var(--well); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.ed-h { display: flex; gap: 14px; align-items: stretch; }
.ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
h6 { margin: 0 0 8px; font-size: var(--t-sm); font-weight: 650; color: var(--dim); display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 2px; white-space: nowrap; }
h6 small { order: 3; flex-basis: 100%; white-space: normal; font-weight: 400; font-size: var(--t-xs); color: var(--faint); }
h6 .seg { margin-left: auto; }
.seg.sm span { height: 20px; font-size: var(--t-2xs); padding: 0 7px; }
.md-ed .fchip { height: 26px; font-size: var(--t-xs); }
.wsopts { display: flex; flex-direction: column; gap: 4px; }
.wsopt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; }
.wsopt b { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 600; color: var(--dim); }
.wsopt small { display: block; font-size: var(--t-xs); color: var(--faint); margin-top: 1px; }

.radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #565b6c; flex: none; margin-top: 2px; }
.wsopt.on .radio, .inst.on .radio { border: 4.5px solid var(--violet-ink); }
.prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
.pbox { display: flex; flex-direction: column; min-height: 0; }
.code { flex: 1; background: var(--editor); border-radius: 9px; box-shadow: inset 0 0 0 1px var(--soft); padding: 10px 12px; font-family: var(--mono); font-size: var(--t-2xs); line-height: 1.6; color: var(--dim); white-space: pre-wrap; overflow: hidden; }
.var { color: var(--violet-ink); background: rgba(121, 92, 236, 0.14); border-radius: 4px; padding: 0 2px; }
.vars { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: var(--t-xs); color: var(--faint); }
.vars .var { font-family: var(--mono); font-size: var(--t-3xs); padding: 2px 5px; }
.vars > span:first-child { margin-right: 4px; }
.savebar { flex: none; height: 52px; margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 0 32px; background: var(--head); box-shadow: inset 0 1px 0 var(--line); font-size: var(--t-sm); color: var(--muted); }
.savebar b { color: var(--text); font-weight: 600; }
.savebar .end { margin-left: auto; display: flex; gap: 8px; }
.insts { background: var(--well); border-radius: 10px; padding: 3px; display: flex; flex-direction: column; }
.inst { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; }
.inst.on { background: var(--violet-soft); }
.inst + .inst { box-shadow: inset 0 1px 0 var(--hair); }
.inst.on + .inst { box-shadow: none; }
.cbox { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid #565b6c; display: grid; place-items: center; flex: none; }
.cbox.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.aside-card { background: var(--well); border-radius: 12px; padding: 14px 16px; margin-top: 56px; }
.ac-h { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); font-weight: 650; color: var(--run); margin-bottom: 12px; }



/* type roles (T3 Code scale; root size = interface size) */
.app, .board { font-family: var(--sans); }
.wordmark { font-size: var(--t-sm); font-weight: 600; letter-spacing: -0.025em; }
.sec { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0; text-transform: none; color: rgba(233, 234, 240, 0.72); padding: 14px 8px 6px; }
.sec .n { color: var(--faint); font-weight: 500; }
.ws .t { font-size: var(--t-sm); font-weight: 500; line-height: 1.43; }
.ws .m, .ws .m .mono { font-size: var(--t-xs); }
.st { font-size: var(--t-xs); font-weight: 500; }
.st.age { font-variant-numeric: tabular-nums; }
.srow, .srow.flat { font-size: var(--t-sm); }
.srow .proj-n { font-size: var(--t-xs); }
.prc { font-size: var(--t-xs); font-weight: 500; }
.kbd { font-family: var(--sans); font-size: var(--t-xs); font-weight: 500; letter-spacing: 0.1em; }
.nav-row, .new-btn, .sfield, .ghost { font-size: var(--t-sm); font-weight: 500; }
.crumb { font-size: var(--t-sm); }
.crumb strong { font-weight: 500; }
.gchip, .gchip .mono { font-size: var(--t-xs); font-weight: 400; }
.umsg { font-size: var(--t-sm); line-height: 1.625; }
.amsg { font-size: var(--t-sm); line-height: 1.625; color: rgba(233, 234, 240, 0.86); }
.amsg p { margin: 0 0 0.65rem; }
code.ic { font-size: var(--t-xs); padding: 0.1rem 0.35rem; }
.codeblk .ch { font-size: var(--t-2xs); }
.codeblk pre { font-size: var(--fs-code); line-height: 1.375; }
.turn-head, .trow { font-size: var(--t-sm); line-height: 1.625; }
.trow .subj { font-size: var(--t-xs); }
.trow .dur { font-size: var(--t-xs); }
.hull .write { font-family: var(--prompt-font); font-size: var(--fs-prompt); line-height: 1.625; }
.pill { font-size: var(--t-xs); font-weight: 400; color: rgba(189, 192, 204, 0.85); }
.pill:hover { color: var(--text); }
.btn { font-size: var(--t-sm); font-weight: 500; }
.btn.sm { font-size: var(--t-xs); }
.tab { font-size: var(--t-xs); font-weight: 500; }
.dl { font-size: var(--fs-code); line-height: 1.6; }
.dfh { font-size: var(--t-xs); }
.dfh .end { font-size: var(--t-2xs); }
.eline { font-size: var(--fs-code); line-height: 1.6; }
.term { font-family: var(--term-font); font-size: var(--fs-term); line-height: 1.5; }
.code { font-size: var(--fs-code); line-height: 1.6; min-height: 13.5em; }
.h1 { font-size: var(--t-xl); font-weight: 600; letter-spacing: -0.01em; }
.sub { font-size: var(--t-sm); }
.shint { font-size: var(--t-desc); line-height: 1.45; }
.sgroup h5, .gcol h5 { font-size: var(--t-sm); font-weight: 400; letter-spacing: -0.005em; text-transform: none; color: rgba(233, 234, 240, 0.7); }
.glabel { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.srowset .lab { font-size: var(--t-sm); font-weight: 500; letter-spacing: -0.005em; }
.srowset .lab small, .gcol small, h6 small { font-size: var(--t-desc); line-height: 1.45; }
.sitem { font-size: var(--t-sm); font-weight: 500; }
.aside h4 { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.chip { font-size: var(--t-3xs); }
.mh { font-size: var(--t-xl); font-weight: 600; }
.fchip { font-size: var(--t-sm); font-weight: 500; }
.grp-h { font-size: var(--t-sm); font-weight: 500; }
.prrow .t { font-size: var(--t-sm); font-weight: 500; }
.prrow .m, .prrow .sig, .wn b { font-size: var(--t-xs); }
.wn span { font-size: var(--t-2xs); }
.kpi .v { font-size: var(--t-2xl); font-weight: 600; }


/* appearance */
.tsec { margin-top: 22px; }
.tsec-h { display: flex; align-items: center; font-size: var(--t-sm); color: rgba(233, 234, 240, 0.7); padding-bottom: 8px; }
.adv { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); font-weight: 500; color: var(--muted); cursor: pointer; }
.frow { padding: 14px 0; box-shadow: inset 0 -1px 0 var(--hair); }
.fr-h { display: flex; align-items: flex-start; gap: 20px; }
.fr-h .lab { flex: 1; font-size: var(--t-sm); font-weight: 500; }
.fr-h .lab small { display: block; font-weight: 400; font-size: var(--t-desc); line-height: 1.45; color: var(--muted); margin-top: 2px; max-width: 460px; }
.fr-c { display: flex; align-items: center; gap: 8px; }
.fsel { position: relative; display: inline-flex; align-items: center; }
.fsel select { appearance: none; height: 32px; min-width: 220px; padding: 0 30px 0 10px; border-radius: 8px; border: 0; background: var(--well); box-shadow: inset 0 0 0 1px var(--border); color: var(--text); font: 500 var(--t-sm) var(--sans); cursor: pointer; }
.fsel select:focus { outline: none; box-shadow: inset 0 0 0 1px var(--violet-line), 0 0 0 3px rgba(121, 92, 236, 0.14); }
.fsel .i { position: absolute; right: 10px; color: var(--faint); pointer-events: none; }
.step { display: inline-flex; align-items: center; height: 32px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--border); }
.step button { width: 28px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.step button:hover { color: var(--text); }
.step .v { min-width: 22px; text-align: center; font: 500 var(--t-sm) var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.step .u { font-size: var(--t-xs); color: var(--faint); margin-right: 4px; }
.fprev { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--well); }
.fprev.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fprev .term { padding: 10px 12px; }


.fpick { position: relative; display: inline-flex; }
.fp-trig { display: inline-flex; align-items: center; gap: 8px; height: 32px; min-width: 230px; padding: 0 10px; border-radius: 8px; background: var(--well); box-shadow: inset 0 0 0 1px var(--border); color: var(--text); font-size: var(--t-sm); cursor: pointer; }
.fp-trig .fp-v { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-trig .i { color: var(--faint); }
.fpick.open .fp-trig { box-shadow: inset 0 0 0 1px var(--violet-line), 0 0 0 3px rgba(121, 92, 236, 0.14); }
.fp-def { font-family: var(--sans); font-size: var(--t-3xs); color: rgba(138, 143, 160, 0.7); }
.fp-pop { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; width: 288px; flex-direction: column; background: var(--deep); border-radius: 12px; box-shadow: var(--shadow-float), inset 0 0 0 1px rgba(255, 255, 255, 0.06); padding: 6px; }
.fpick.open .fp-pop, .fp-pop.show { display: flex; }
.fp-search { display: flex; align-items: center; gap: 7px; margin: 2px 6px 6px; padding-bottom: 6px; box-shadow: inset 0 -1px 0 var(--border); color: var(--faint); }
.fp-search input { flex: 1; border: 0; background: none; outline: none; color: var(--text); font: var(--t-sm) var(--sans); height: 26px; }
.fp-list { display: flex; flex-direction: column; max-height: 260px; overflow: auto; }
.fp-it { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 7px; font-size: var(--t-sm); color: var(--dim); cursor: pointer; }
.fp-it > span:first-child { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-it:hover { background: var(--hover); color: var(--text); }
.fp-it.on { color: var(--text); }
.fp-it .i { color: var(--muted); }
.fp-foot { font-size: var(--t-2xs); color: var(--faint); padding: 6px 8px 2px; }
.field.bad { box-shadow: inset 0 0 0 1px rgba(224, 108, 96, 0.7); }


/* markdown (T3 Code structure, OpenChamber colour) */
:root {
  --md-code: #d2c4ff;
  --md-code-bg: rgba(121, 92, 236, 0.13);
  --md-code-line: rgba(161, 140, 255, 0.26);
  --md-marker: rgba(161, 140, 255, 0.75);
  --md-link: #7fa8f8;
  --md-strong: #f4f4f8;
}
.amsg strong, .amsg b, .umsg b { color: var(--md-strong); font-weight: 600; }
code.ic { font-family: var(--mono); font-size: 0.86em; font-weight: 500; color: var(--md-code); background: var(--md-code-bg); box-shadow: inset 0 0 0 1px var(--md-code-line); border: 0; border-radius: 0.4em; padding: 0.12em 0.4em; white-space: nowrap; }
.umsg code.ic { background: rgba(121, 92, 236, 0.2); }
.flink { display: inline-flex; align-items: center; gap: 0.33em; height: 1.5em; max-width: 100%; padding: 0 0.5em; border-radius: 0.5em; vertical-align: -0.28em; font-family: var(--sans); font-size: var(--t-xs); font-weight: 500; line-height: 1; color: var(--text); background: rgba(255, 255, 255, 0.045); box-shadow: inset 0 0 0 1px var(--border); cursor: pointer; white-space: nowrap; }
.flink:hover { background: rgba(255, 255, 255, 0.08); }
.flink .i { width: 1.1em; height: 1.1em; }
.flink .ln { color: var(--faint); font-family: var(--mono); font-size: 0.95em; }
.flink.css .i { color: #56a8f5; } .flink.tsx .i { color: #5ab8ff; } .flink.md .i { color: #bcbec4; } .flink.cs .i { color: #b49cff; }
.amsg a, .mdx a { color: var(--md-link); text-decoration: none; }
.amsg a:hover, .mdx a:hover { background-image: radial-gradient(circle, currentcolor 0.75px, transparent 1px); background-position: left bottom; background-repeat: repeat-x; background-size: 4px 2px; }
.amsg ul, .mdx ul { padding-left: 1.25rem; }
.amsg li::marker, .mdx li::marker { color: var(--md-marker); }
.mdx ol > li::marker { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.mdx { font-size: var(--t-sm); line-height: 1.625; color: rgba(233, 234, 240, 0.86); }
.mdx > :first-child { margin-top: 0; }
.mdx p, .mdx ul, .mdx ol, .mdx blockquote, .mdx .codeblk, .mdx .mdtable, .mdx .alert { margin: 0.65rem 0; }
.mdx li + li { margin-top: 0.25rem; }
.mdx h1, .mdx h2, .mdx h3, .mdx h4 { margin: 1.25rem 0 0.5rem; font-weight: 600; line-height: 1.3; color: var(--text); }
.mdx h1 { font-size: var(--t-xl); } .mdx h2 { font-size: var(--t-lg); } .mdx h3 { font-size: var(--t-base); } .mdx h4 { font-size: var(--t-sm); }
.mdx h1 + p, .mdx h2 + p { margin-top: 0.35rem; }
.mdx blockquote { border-left: 2px solid var(--border); padding-left: 0.8rem; color: var(--muted); }
.mdx hr { border: 0; height: 1px; background: var(--border); margin: 1.1rem 0; }
.mdx kbd { display: inline-flex; align-items: center; height: 1.45em; padding: 0 0.45em; border-radius: 0.35em; font: 500 var(--t-xs) var(--sans); color: var(--dim); background: var(--raised); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.45), inset 0 0 0 1px var(--border); vertical-align: 0.05em; }
.mdx .task { list-style: none; margin-left: -1.25rem; display: flex; gap: 8px; align-items: flex-start; }
.mdx .task .cb { margin-top: 0.2rem; }
.mdx .task.done > span:last-child { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(138, 143, 160, 0.5); }
.mdtable { border-radius: 10px; overflow: hidden; background: var(--well); box-shadow: inset 0 0 0 1px var(--soft); }
.mdtable table { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
.mdtable th { text-align: left; font-weight: 600; color: var(--muted); padding: 0.5rem 0.75rem; background: rgba(255, 255, 255, 0.025); }
.mdtable td { padding: 0.45rem 0.75rem; color: var(--dim); box-shadow: inset 0 1px 0 var(--hair); }
.mdtable td.num { font-family: var(--mono); text-align: right; }
.alert { border-radius: 10px; padding: 0.55rem 0.8rem 0.6rem; background: var(--tone-bg); box-shadow: inset 2px 0 0 var(--tone); }
.alert .ah { display: flex; align-items: center; gap: 7px; font-size: var(--t-xs); font-weight: 600; color: var(--tone); margin-bottom: 2px; }
.alert.note { --tone: #7fa8f8; --tone-bg: rgba(84, 138, 247, 0.08); }
.alert.warn { --tone: var(--approval); --tone-bg: rgba(232, 180, 79, 0.07); }
.codeblk { background: var(--well); border: 0; box-shadow: inset 0 0 0 1px var(--soft); border-radius: 12px; }
.codeblk .ch { height: 34px; padding: 0 6px 0 12px; gap: 8px; font-family: var(--sans); font-size: var(--t-2xs); color: rgba(233, 234, 240, 0.72); background: rgba(255, 255, 255, 0.02); box-shadow: inset 0 -1px 0 var(--soft); }
.codeblk .ch .lang { font-family: var(--mono); color: var(--faint); }
.codeblk .ch .end { display: flex; gap: 2px; }
.codeblk .ch .iconbtn { width: 26px; height: 26px; }
.codeblk pre { padding: 10px 14px 12px; }



.em { width: 250px; background: var(--deep); border-radius: 12px; box-shadow: var(--shadow-float), inset 0 0 0 1px rgba(255, 255, 255, 0.07); padding: 6px; }
.em-h { font-size: var(--t-xs); font-weight: 500; color: var(--muted); padding: 6px 8px 4px; }
.em-it { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 8px; border-radius: 8px; font-size: var(--t-sm); color: var(--dim); cursor: pointer; }
.em-it:hover { background: var(--hover); color: var(--text); }
.em-it.on { background: var(--raised); color: var(--text); font-weight: 500; }
.em-l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.em-l small { font-size: var(--t-xs); color: var(--faint); font-weight: 400; margin-top: 1px; }
.em-def { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 8px; border-radius: 5px; font-size: var(--t-3xs); font-weight: 600; color: #b8c9f5; background: rgba(84, 138, 247, 0.16); vertical-align: 0.1em; }
.em-sep { height: 1px; background: var(--hair); margin: 6px 4px; }

/* model picker */
.mp-stage { position: relative; overflow: hidden; }
.pill.on-pill { background: rgba(121, 92, 236, 0.16); color: var(--text); }
.mp-anchor { position: absolute; z-index: 2; }
.mp { width: 400px; background: var(--deep); border-radius: 14px; box-shadow: var(--shadow-float), inset 0 0 0 1px rgba(255, 255, 255, 0.07); display: flex; flex-direction: column; overflow: hidden; }
.mp-search { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; color: var(--faint); box-shadow: inset 0 -1px 0 var(--hair); }
.mp-search input { flex: 1; border: 0; outline: none; background: none; color: var(--text); font: var(--t-sm) var(--sans); }
.mp-search input::placeholder { color: var(--faint); }
.mp-act { display: flex; align-items: center; gap: 9px; height: 34px; margin: 4px 6px 0; padding: 0 8px; border-radius: 8px; font-size: var(--t-sm); font-weight: 500; color: var(--dim); }
.mp-act:hover { background: var(--hover); color: var(--text); }
.mp-act .mp-hint { margin-left: auto; font: var(--t-2xs) var(--mono); color: var(--faint); }
.mp-list { max-height: 420px; overflow: auto; padding: 2px 6px 6px; }
.mp-grp + .mp-grp { margin-top: 2px; }
.mp-gh { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px; font-size: var(--t-xs); font-weight: 500; color: rgba(233, 234, 240, 0.72); }
.mp-gh .n { color: var(--faint); }
.mp-gh .mp-chev { margin-left: auto; color: var(--faint); }
.mp-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: var(--t-sm); color: var(--dim); cursor: pointer; }
.mp-row:hover, .mp-row.hi { background: var(--raised); color: var(--text); }
.mp-row.sel .mp-n { color: var(--text); font-weight: 600; }
.mp-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.mp-ctx { font-size: var(--t-xs); color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.mp-end { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.mp-eff { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-xs); color: var(--muted); }
.mp-eff b { color: var(--violet-ink); font-weight: 600; }
.mp-eff .i { color: var(--faint); }
.flipx { transform: scaleX(-1); }
.mp-check { color: var(--violet-ink); }
.mp-star { width: 16px; text-align: center; color: #4d5264; font-size: 14px; }
.mp-row:hover .mp-star, .mp-row.hi .mp-star { color: var(--muted); }
.mp-star.on { color: var(--approval) !important; }
.mp-foot { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 12px; font-size: var(--t-xs); color: var(--faint); box-shadow: inset 0 1px 0 var(--hair); }
.mp-foot .kbd { letter-spacing: 0.02em; color: var(--muted); margin-right: 3px; }
.mp-card { min-width: 320px; background: var(--deep); border-radius: 12px; box-shadow: var(--shadow-float), inset 0 0 0 1px rgba(255, 255, 255, 0.07); padding: 8px 12px; }
.mp-kv { display: flex; gap: 16px; align-items: baseline; padding: 5px 0; font-size: var(--t-xs); color: var(--muted); }
.mp-kv + .mp-kv { box-shadow: inset 0 1px 0 var(--hair); }
.mp-kv b { margin-left: auto; text-align: right; font-weight: 500; color: var(--text); }
.mp-kv b u { text-decoration: none; color: var(--violet-ink); font-weight: 600; }


/* composer: today's geometry (theme.css .composer / .composer-writing / .composer-recipe-row) */
.measure { max-width: 920px; padding: 30px 20px 0; }
.cwrap { padding: 12px 20px 18px; }
.cstack { max-width: 880px; }
.hull { display: flex; flex-direction: column; min-height: 156px; border-radius: 12px; background: linear-gradient(180deg, rgba(142, 163, 199, 0.09), rgba(142, 163, 199, 0.02) 55%), var(--composer); border: 1px solid rgba(142, 163, 199, 0.25); box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5); }
.hull.focus { border-color: rgba(161, 140, 255, 0.6); box-shadow: 0 0 0 1px rgba(161, 140, 255, 0.3), 0 16px 42px rgba(0, 0, 0, 0.55); }
.hull .write { flex: 1; min-height: 92px; padding: 20px 24px 4px; color: #f4f2fb; }
.recipe { min-height: 52px; gap: 8px; padding: 0 12px 10px; align-items: center; }
.recipe .pill { height: 34px; padding: 0 10px; border-radius: 6px; font-size: var(--t-sm); font-weight: 400; color: #eeeef5; }
.recipe .pill:first-child { width: 34px !important; padding: 0; justify-content: center; color: #9da1a8; }
.recipe .pill .chev { color: #868a93; }
.recipe .ring { width: 34px; height: 34px; }
.recipe .send, .recipe .stop { width: 40px; height: 40px; border-radius: 10px; }
.dock, .apprdock, .q, .prdock { margin: 0 14px; }
.wsbar { margin: 0 14px; }


/* tool rail */
.app:has(> .rail) { grid-template-columns: 288px 1fr var(--rw, 424px) 44px; }
.app.no-right:has(> .rail) { grid-template-columns: 288px 1fr 44px; }
.rail { background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 48px 0 10px; }
.rail-b { position: relative; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }
.rail-b:hover { background: var(--hover); color: var(--text); }
.rail-b.on { background: var(--violet-soft); color: var(--violet-ink); }
.rail-b.on::before { content: ""; position: absolute; left: -6px; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--violet); }
.rail-b.on-soft { color: var(--dim); }
.rail-b.away::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.rail-badge { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--raised); color: var(--dim); font-size: 9px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.rail-badge.run { background: var(--run); color: #0d1a0d; }
.rail-dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); }
.rail-sep { width: 18px; height: 1px; background: var(--border); margin: 4px 0; flex: none; }
.rail-end { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.phead { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 100px 0 12px; box-shadow: inset 0 -1px 0 var(--line); }
.phead.sub { padding-right: 8px; height: 36px; }
.phead .ph-ic { color: var(--violet-ink); }
.phead .ph-t { font-size: var(--t-sm); font-weight: 600; color: var(--text); white-space: nowrap; }
.phead .ph-m { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }
.phead .ph-a { margin-left: auto; display: flex; gap: 2px; }
.term-tabs { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
.tt { height: 22px; padding: 0 8px; border-radius: 6px; font-size: var(--t-xs); color: var(--muted); display: inline-flex; align-items: center; }
.tt.on { background: var(--raised); color: var(--text); }
.ov { overflow: auto; padding: 12px; gap: 10px; }
.ov-sec { background: var(--well); border-radius: 12px; padding: 10px 12px; flex: none; }
.ov-h { display: flex; align-items: center; gap: 8px; height: 26px; font-size: var(--t-sm); color: var(--muted); }
.ov-h b { color: var(--text); font-weight: 600; }
.ov-h .ov-chev { color: var(--faint); }
.ov-h .ov-r { margin-left: auto; font-size: var(--t-xs); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ov-kv { display: flex; align-items: center; gap: 12px; min-height: 26px; font-size: var(--t-xs); color: var(--muted); }
.ov-kv span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-kv b { margin-left: auto; font-weight: 500; color: var(--dim); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.ov-todo { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: var(--t-xs); color: var(--dim); }
.ov-todo.done { color: var(--faint); text-decoration: line-through; }


/* needs-you rows */
:root { --update: #56c2d6; }
.sec.needs { color: var(--text); font-weight: 600; }
.needs-n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; background: var(--approval); color: #201b10; font-size: var(--t-3xs); font-weight: 700; }
.ws.attn { margin-bottom: 4px; padding: 8px 8px 8px 12px; background: linear-gradient(90deg, var(--att-bg), rgba(0, 0, 0, 0) 90%); box-shadow: inset 2px 0 0 var(--att); border-radius: 8px; }
.ws.attn.appr { --att: var(--approval); --att-bg: rgba(232, 180, 79, 0.13); --att-soft: rgba(232, 180, 79, 0.18); }
.ws.attn.input { --att: #7fa8f8; --att-bg: rgba(84, 138, 247, 0.14); --att-soft: rgba(84, 138, 247, 0.2); }
.ws.attn.update { --att: var(--update); --att-bg: rgba(86, 194, 214, 0.12); --att-soft: rgba(86, 194, 214, 0.18); }
.ws.attn.on-row { background: linear-gradient(90deg, var(--att-bg), rgba(121, 92, 236, 0.18) 90%) !important; box-shadow: inset 2px 0 0 var(--att), inset 0 0 0 1px var(--violet-line); }
.ws.attn.on-row::before { display: none; }
.ws.attn .t { color: var(--text); font-weight: 600; }
.att-line { margin-top: 2px; font-size: var(--t-xs); color: var(--att); opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-line .mono { font-size: var(--t-xs); }
.att-chip { display: inline-flex; align-items: center; gap: 4px; color: var(--att); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.ws.attn.appr .att-chip .i { animation: pulse 1.6s ease-in-out infinite; }


/* PR rows: linked session inline, one fixed-width action */
.prrow .m2 { margin-top: 5px; display: flex; min-width: 0; }
.sesschip { display: inline-flex; align-items: center; gap: 6px; height: 22px; max-width: 100%; margin-left: 0; padding: 0 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.045); box-shadow: inset 0 0 0 1px var(--border); font-size: var(--t-xs); font-weight: 500; color: var(--dim); cursor: pointer; flex: 0 1 auto; min-width: 0; }
.sesschip:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
.sesschip .sc-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-st { display: inline-flex; align-items: center; gap: 3px; flex: none; color: var(--faint); font-weight: 500; }
.sc-st.run { color: var(--run); }
.sc-st.upd { color: var(--update); }
.pract { justify-self: stretch; display: flex; width: 176px; border-radius: 7px; overflow: hidden; }
.pract .btn { border-radius: 0; }
.pract .pa-main { flex: 1; min-width: 0; justify-content: flex-start; gap: 7px; }
.pract .pa-main span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pract .pa-more { width: 28px; padding: 0; justify-content: center; box-shadow: inset 1px 0 0 rgba(0, 0, 0, 0.3); }


.taskbar { display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 10px; background: rgba(32, 32, 32, 0.92); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
.tb-ic { position: relative; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
.tb-ic.cw { background: rgba(255, 255, 255, 0.07); }
.tb-badge { position: absolute; right: -4px; bottom: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--approval); color: #201b10; font: 700 10px/16px var(--sans); text-align: center; box-shadow: 0 0 0 2px #202020; }
.tb-run { position: absolute; bottom: -9px; left: 50%; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: #9aa0a6; }


/* motion demo */
:root { --dur-fast: 150ms; --dur-base: 180ms; --ease-out: cubic-bezier(0.22, 1, 0.36, 1); }
.mo-demo { background: var(--bg); border-radius: 12px; padding: 12px; }
.mo-h { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); font-weight: 500; color: var(--muted); margin-bottom: 8px; }
.mo-h .btn { margin-left: auto; }
.mo-stage { position: relative; height: 200px; background: var(--editor); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.mo-pop { position: absolute; left: 12px; bottom: 58px; transform-origin: bottom left; transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.mo-pop.enter { opacity: 0; transform: scale(0.98) translateY(4px); transition: none; }
.mo-fold { overflow: hidden; transition: height var(--dur-base) var(--ease-out); }
.mo-chev { display: inline-flex; transition: transform var(--dur-base) var(--ease-out); }
.mo-chev.open { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .mo-pop, .mo-fold, .mo-chev { transition: none !important; } }

/* controls */
.cb { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; background: #1d2029; box-shadow: inset 0 0 0 1.5px #5d6378; color: #fff; }
.cb.on { background: var(--violet); box-shadow: none; }
.cb.mixed { background: var(--violet); box-shadow: none; }
.cb.mixed::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: #fff; }
.cb.hov { box-shadow: inset 0 0 0 1.5px #8a8fa0; }
.cb.dis { opacity: 0.4; }
.rd { width: 16px; height: 16px; border-radius: 50%; flex: none; background: #1d2029; box-shadow: inset 0 0 0 1.5px #5d6378; display: grid; place-items: center; }
.rd.on { box-shadow: inset 0 0 0 1.5px var(--violet-ink); }
.rd.on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--violet-ink); }
.rd.hov { box-shadow: inset 0 0 0 1.5px #8a8fa0; }
.rd.dis { opacity: 0.4; }
.rd.qi.on { box-shadow: inset 0 0 0 1.5px var(--input); }
.rd.qi.on::after { background: var(--input); }
.cbl { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; font-size: var(--t-sm); color: var(--dim); }
.cbl:hover { background: var(--hover); }
.cbl.on { color: var(--text); }
.cbgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6px; margin-left: -8px; }
.ctlrow { display: flex; align-items: center; gap: 14px; height: 34px; font-size: var(--t-sm); color: var(--muted); }
.ctlrow .nm { width: 82px; color: var(--faint); font-size: var(--t-xs); }
.ctlrow .it { display: inline-flex; align-items: center; gap: 7px; width: 108px; }

/* boards */
.board { width: 1440px; min-height: 900px; margin: 0 auto; background: #0c0e13; border-radius: 10px; padding: 28px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; align-content: start; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
.cell { background: var(--editor); border-radius: 12px; padding: 16px; position: relative; }
.cell.panel { background: var(--bg); }
.cell.flush { padding: 0; overflow: hidden; }
.cell > .lab { font-size: var(--t-2xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin-bottom: 12px; }
.span4 { grid-column: span 4; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span7 { grid-column: span 7; } .span8 { grid-column: span 8; } .span3 { grid-column: span 3; } .span12 { grid-column: span 12; }
.toast { position: relative; background: var(--deep); border-radius: 12px; padding: 10px 10px 10px 14px; box-shadow: var(--shadow-float), inset 0 0 0 1px rgba(255, 255, 255, 0.05); margin-bottom: 10px; overflow: hidden; }
.toast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tone); }
.toast .tt { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); font-weight: 650; }
.toast .tt .i:first-child { color: var(--tone); }
.toast .tt .end { margin-left: auto; color: var(--faint); }
.toast .tm { font-size: var(--t-xs); color: var(--muted); margin: 4px 0 0 23px; line-height: 1.5; }
.toast .ta { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
.sw { display: flex; flex-direction: column; gap: 6px; font-size: var(--t-xs); color: var(--muted); }
.sw i { display: block; height: 44px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
.sw b { color: var(--dim); font-weight: 600; font-size: var(--t-xs); }
.sw .mono { font-size: var(--t-3xs); color: var(--faint); }
.rule { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--hair); font-size: var(--t-sm); color: var(--muted); line-height: 1.55; }
.rule b { color: var(--text); display: block; font-weight: 650; margin-bottom: 2px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--faint); font-size: var(--t-sm); text-align: center; }
</style>
