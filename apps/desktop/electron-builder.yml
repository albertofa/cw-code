appId: com.cwcode.app
productName: cw-code
copyright: Copyright (C) 2026 cw-code
directories:
  output: dist
  buildResources: resources
npmRebuild: false
asar: true
files:
  - "out/**"
  - "!out/renderer/**"
  - "package.json"
afterPack: build/afterPack.cjs
toolsets:
  appimage: "1.0.3"
publish:
  - provider: github
    owner: albertofa
    repo: cw-code
    releaseType: draft
generateUpdatesFilesForAllChannels: true
extraResources:
  - from: ../server/dist
    to: server
    filter:
      - "**/*"
  - from: ../server/dist/node_modules
    to: server/node_modules
    filter:
      - "**/*"
  - from: resources
    to: branding
    filter:
      - "**/*"
      - "!icons/**"
win:
  icon: resources/icon.ico
  executableName: cw-code
  signExecutable: false
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
linux:
  executableName: cw-code
  category: Development
  icon: resources/icons
  maintainer: albertofa <albertofa@users.noreply.github.com>
  desktop:
    entry:
      StartupWMClass: cw-code
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: "${productName}-${version}-x86_64.${ext}"
deb:
  artifactName: "${productName}-${version}-amd64.${ext}"
  depends:
    - libasound2t64 | libasound2
    - libgtk-3-0t64 | libgtk-3-0
    - libnss3
    - libsecret-1-0
    - xdg-utils
    - libnotify4
    - libxss1
    - libxtst6
