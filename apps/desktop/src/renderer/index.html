<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A desktop workspace for Claude Code, OpenCode, and Codex." />
    <link rel="icon" type="image/svg+xml" href="./src/assets/console-c.svg" />
    <script>
      (function () {
        try {
          var mode = window.localStorage.getItem("cw-code:theme");
          var light = mode === "light" || (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #080a0f;
        margin: 0;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #e8e6dc;
      }
    </style>
    <title>cw-code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
