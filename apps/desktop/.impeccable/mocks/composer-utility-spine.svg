<svg xmlns="http://www.w3.org/2000/svg" width="1674" height="943" viewBox="0 0 1674 943">
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1422"/>
      <stop offset="0.55" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0a111e"/>
    </linearGradient>
    <linearGradient id="composer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2135"/>
      <stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <linearGradient id="send" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b3cff"/>
      <stop offset="1" stop-color="#5420ea"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02050c" flood-opacity="0.54"/>
    </filter>
    <filter id="sendGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#6f37ff" flood-opacity="0.34"/>
    </filter>
    <clipPath id="shellClip"><rect x="352" y="724" width="768" height="162" rx="12"/></clipPath>
  </defs>
  <image href="file:///C:/Projects/cw-code/apps/desktop/.impeccable/mocks/composer-integrated-hull.png" x="0" y="0" width="1674" height="943"/>

  <!-- restore the quiet center canvas before drawing the alternative -->
  <rect x="338" y="700" width="795" height="214" fill="url(#pane)"/>

  <!-- one continuous composer body -->
  <g filter="url(#shadow)">
    <rect x="352" y="724" width="768" height="162" rx="12" fill="url(#composer)"/>
    <g clip-path="url(#shellClip)">
      <rect x="352" y="724" width="48" height="162" fill="#111726"/>
      <rect x="352" y="724" width="48" height="54" fill="#171e30" opacity="0.72"/>
    </g>
  </g>

  <!-- the utility spine: three icon-only insertion modes -->
  <g fill="none" stroke="#d9dcf1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 751h12M376 745v12"/>
    <path d="M381 801c-1.7 2.3-4.2 3.4-6.8 3.1-4.8-.6-7.2-5.9-4.9-10.1 2.1-3.9 7.2-5.1 10.7-2.4 3.4 2.6 3.5 8.4.2 10.5-1.7 1.1-3.4.2-3.3-1.4l.4-5.2"/>
    <path d="M371 848l10-12M369 838h5M378 846h5"/>
  </g>

  <!-- writing area -->
  <text x="420" y="761" fill="#aeb4d5" font-family="Inter, Segoe UI, sans-serif" font-size="15">Ask cw-code — @ files, / commands, $ skills</text>
  <rect x="419" y="746" width="1.4" height="22" rx="0.7" fill="#b99bff"/>

  <!-- low-noise runtime controls on one baseline -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#e8e8f2">
    <circle cx="690" cy="855" r="9" fill="#f36b2f"/>
    <path d="M684 855h12M690 849v12M686 851l8 8M694 851l-8 8" stroke="#4d170d" stroke-width="1" opacity="0.75"/>
    <text x="707" y="860">Claude Sonnet</text>
    <path d="M806 853l4 4 4-4" fill="none" stroke="#999fbe" stroke-width="1.4"/>

    <path d="M839 851h16M843 847v8M851 855v5" fill="none" stroke="#c8cbe0" stroke-width="1.5" stroke-linecap="round"/>
    <text x="864" y="860">High</text>
    <path d="M901 853l4 4 4-4" fill="none" stroke="#999fbe" stroke-width="1.4"/>

    <path d="M933 848l7-3 7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10z" fill="#a98af7"/>
    <path d="M938 851h4v6h-4z" fill="#171b2b" opacity="0.9"/>
    <text x="955" y="860">Auto</text>
    <path d="M991 853l4 4 4-4" fill="none" stroke="#999fbe" stroke-width="1.4"/>

    <path d="M1021 849h11v12h-11zM1023 846h7" fill="none" stroke="#c8cbe0" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="1038" y="860">3</text>
  </g>

  <!-- send is part of the same shell, not a detached button -->
  <g filter="url(#sendGlow)">
    <rect x="1068" y="838" width="42" height="40" rx="9" fill="url(#send)"/>
  </g>
  <path d="M1080 858h18M1091 851l7 7-7 7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
